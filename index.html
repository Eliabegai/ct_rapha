  if(newInstructorBtn) newInstructorBtn.onclick = ()=>{
    state.editingInstructor = null;
    state.showInstructorModal = true;
    render();
  };

  // contacts table
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = ()=>{ state.search = searchInput.value; render(); searchInput.focus(); const val=searchInput.value; searchInput.value=val; searchInput.setSelectionRange(val.length,val.length); };
  }
  const sfs = document.getElementById('statusFilterSelect');
  if(sfs) sfs.onchange = ()=>{ state.statusFilter = sfs.value; render(); };
  const pfs = document.getElementById('personaFilterSelect');
  if(pfs) pfs.onchange = ()=>{ state.personaFilter = pfs.value; render(); };

  document.querySelectorAll('[data-edit-contact]').forEach(b=>{
    b.onclick = ()=>{
      const c = state.contacts.find(x=>x.id===b.dataset.editContact);
      state.editingContact = c;
      state.showContactModal = true;
      render();
    };
  });
  document.querySelectorAll('[data-del-contact]').forEach(b=>{
    b.onclick = ()=>{
      const c = state.contacts.find(x=>x.id===b.dataset.delContact);
      state.confirmDelete = {type:'contact', id:c.id, message:`Excluir o contato "${c.name}"? Essa ação não pode ser desfeita.`};
      render();
    };
  });

  document.querySelectorAll('[data-edit-unit]').forEach(b=>{
    b.onclick = ()=>{
      const u = state.units.find(x=>x.id===b.dataset.editUnit);
      state.editingUnit = u;
      state.showUnitModal = true;
      render();
    };
  });
  // classes (turmas)
  document.querySelectorAll('[data-edit-class]').forEach(b=>{
    b.onclick = ()=>{
      const cl = state.classes.find(x=>x.id===b.dataset.editClass);
      state.editingClass = cl;
      state.showClassModal = true;
      render();
    };
  });
  document.querySelectorAll('[data-del-class]').forEach(b=>{
    b.onclick = ()=>{
      const cl = state.classes.find(x=>x.id===b.dataset.delClass);
      state.confirmDelete = {type:'class', id:cl.id, message:`Excluir a turma "${cl.name}"? Essa ação não pode ser desfeita.`};
      render();
    };
  });

  // leveling (nivelamento)
  document.querySelectorAll('[data-level-change]').forEach(sel=>{
    sel.onchange = async ()=>{
      const contact = state.contacts.find(c=>c.id===sel.dataset.levelChange);
      if(contact){
        if(typeof changeLevel==='function') return changeLevel(contact, sel.value);
        contact.level = sel.value;
        await saveContacts();
        render();
        showToast('Nível atualizado');
      }
    };
  });

  // finance (financeiro)
  document.querySelectorAll('[data-edit-transaction]').forEach(b=>{
    b.onclick = ()=>{
      const t = state.transactions.find(x=>x.id===b.dataset.editTransaction);
      state.editingTransaction = t;
      state.showTransactionModal = true;
      render();
    };
  });
  document.querySelectorAll('[data-del-transaction]').forEach(b=>{
    b.onclick = ()=>{
      const t = state.transactions.find(x=>x.id===b.dataset.delTransaction);
      state.confirmDelete = {type:'transaction', id:t.id, message:`Excluir o lançamento "${t.description}"? Essa ação não pode ser desfeita.`};
      render();
    };
  });
  const finMonthInput = document.getElementById('finMonthInput');
  if(finMonthInput) finMonthInput.onchange = ()=>{ state.finMonth = finMonthInput.value; render(); };
  const finTypeSelect = document.getElementById('finTypeSelect');
  if(finTypeSelect) finTypeSelect.onchange = ()=>{ state.finType = finTypeSelect.value; render(); };
  const classesInstructorSelect = document.getElementById('classesInstructorSelect');
  if(classesInstructorSelect) classesInstructorSelect.onchange = ()=>{ state.classesInstructorFilter = classesInstructorSelect.value; render(); };
  document.querySelectorAll('[data-eval-cal-nav]').forEach(b=>{
    b.onclick = ()=>{
      const delta = Number(b.dataset.evalCalNav);
      const [y,m] = state.evalCalendarMonth.split('-').map(Number);
      const d = new Date(y, m-1+delta, 1);
      state.evalCalendarMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      render();
    };
  });
  document.querySelectorAll('[data-eval-cal-day]').forEach(cell=>{
    cell.onclick = ()=>{
      const day = cell.dataset.evalCalDay;
      state.evalSelectedDate = state.evalSelectedDate===day ? null : day;
      render();
    };
  });
  const evalClearSelectedDate = document.getElementById('evalClearSelectedDate');
  if(evalClearSelectedDate) evalClearSelectedDate.onclick = ()=>{ state.evalSelectedDate = null; render(); };

  // bookings (aula experimental)
  document.querySelectorAll('[data-confirm-eval]').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.confirmEval;
      const booking = state.bookings.find(x=>x.id===id);
      if(!booking) return;
      const attended = document.querySelector(`[data-eval-attend="${id}"]`).value;
      const level = document.querySelector(`[data-eval-level="${id}"]`).value;
      const notes = document.querySelector(`[data-eval-notes="${id}"]`).value.trim();
      booking.attended = attended;
      booking.professorNotes = notes;

      const contact = booking.contactId ? state.contacts.find(c=>c.id===booking.contactId) : null;

      if(attended === 'Sim'){
        booking.confirmedLevel = level;
        booking.status = 'Concluído';
        if(contact){
          contact.level = level;
          contact.status = 'Pós-Aula · Fechamento';
        }
        await saveBookings();
        if(contact) await saveContacts();
        render();
        showToast('Presença confirmada, aluno nivelado e encaminhado para a Gabi fechar o contrato');
      }else{
        booking.status = 'Faltou';
        // Falta também vai para Pós-Aula, para a Gabi reagendar a experimental com o aluno
        if(contact){
          contact.status = 'Pós-Aula · Fechamento';
        }
        await saveBookings();
        if(contact) await saveContacts();
        render();
        showToast('Falta registrada e encaminhada para a Gabi reagendar a experimental');
      }
    };
  });
  document.querySelectorAll('[data-cancel-booking]').forEach(b=>{
    b.onclick = async ()=>{
      const booking = state.bookings.find(x=>x.id===b.dataset.cancelBooking);
      if(booking){
        booking.status = 'Cancelado';
        await saveBookings();
        render();
        showToast('Agendamento marcado como cancelado');
      }
    };
  });
  document.querySelectorAll('[data-del-booking]').forEach(b=>{
    b.onclick = ()=>{
      const booking = state.bookings.find(x=>x.id===b.dataset.delBooking);
      state.confirmDelete = {type:'booking', id:booking.id, message:`Excluir o agendamento de "${booking.name}"? Essa ação não pode ser desfeita.`};
      render();
    };
  });

  // evaluations (sistema de avaliações)
  document.querySelectorAll('[data-confirm-evaluation]').forEach(b=>{
    b.onclick = async ()=>{
      try{
        const id = b.dataset.confirmEvaluation;
        const ev = state.evaluations.find(x=>x.id===id);
        if(!ev){ showToast('Avaliação não encontrada — recarregue a aba'); return; }
        const newLevelEl = document.querySelector(`[data-eval-newlevel="${id}"]`);
        const notesEl = document.querySelector(`[data-eval-obs="${id}"]`);
        const chargeEl = document.querySelector(`[data-eval-charge="${id}"]`);
        if(!newLevelEl || !notesEl || !chargeEl){ showToast('Erro ao ler o formulário — tente novamente'); return; }
        const newLevel = newLevelEl.value;
        const notes = notesEl.value.trim();
        const charge = chargeEl.checked;
        ev.newLevel = newLevel;
        ev.notes = notes;
        ev.status = 'Realizada';
        await saveEvaluations();

        const contact = state.contacts.find(c=>c.id===ev.contactId);
        if(contact){
          contact.level = newLevel;
          await saveContacts();
        }

        if(charge){
          state.transactions.push({
            id: uid(),
            type: 'Receita',
            category: 'Prova de Nivelamento',
            description: `Prova de Nivelamento - ${contact ? contact.name : ev.contactName||''}`,
            amount: 60,
            date: new Date().toISOString().slice(0,10),
            unitId: ev.unitId,
            status: 'Pendente',
          });
          await saveTransactions();
        }

        render();
        showToast(charge ? 'Avaliação confirmada e cobrança lançada no Financeiro' : 'Avaliação confirmada e aluno atualizado');
      }catch(err){
        console.error('Erro ao confirmar avaliação:', err);
        showToast('Erro ao salvar a avaliação — veja o console para detalhes');
      }
    };
  });
  document.querySelectorAll('[data-del-evaluation]').forEach(b=>{
    b.onclick = ()=>{
      const ev = state.evaluations.find(x=>x.id===b.dataset.delEvaluation);
      state.confirmDelete = {type:'evaluation', id:ev.id, message:`Excluir esta avaliação? Essa ação não pode ser desfeita.`};
      render();
    };
  });

  document.querySelectorAll('[data-open-ficha]').forEach(el=>{
    el.onclick = ()=>{
      state.fichaContactId = el.dataset.openFicha;
      state.fichaTab = 'checklist';
      state.fichaConfirmPromote = false;
      state.showFichaModal = true;
      render();
    };
  });
  document.querySelectorAll('[data-open-attendance]').forEach(el=>{
    el.onclick = ()=>{
      state.attendanceClassId = el.dataset.openAttendance;
      state.showAttendanceModal = true;
      render();
    };
  });

  // instructors (professores)
  document.querySelectorAll('[data-edit-instructor]').forEach(b=>{
    b.onclick = ()=>{
      const i = state.instructors.find(x=>x.id===b.dataset.editInstructor);
      state.editingInstructor = i;
      state.showInstructorModal = true;
      render();
    };
  });
  document.querySelectorAll('[data-del-instructor]').forEach(b=>{
    b.onclick = ()=>{
      const i = state.instructors.find(x=>x.id===b.dataset.delInstructor);
      state.confirmDelete = {type:'instructor', id:i.id, message:`Excluir o professor "${i.name}"? Essa ação não pode ser desfeita.`};
      render();
    };
  });

  // plans (catálogo)
  document.querySelectorAll('[data-edit-plan]').forEach(b=>{
    b.onclick = ()=>{
      const p = state.plans.find(x=>x.id===b.dataset.editPlan);
      state.editingPlan = p;
      state.showPlanModal = true;
      render();
    };
  });
  document.querySelectorAll('[data-del-plan]').forEach(b=>{
    b.onclick = ()=>{
      const p = state.plans.find(x=>x.id===b.dataset.delPlan);
      state.confirmDelete = {type:'plan', id:p.id, message:`Excluir o plano "${p.name}"? Essa ação não pode ser desfeita.`};
      render();
    };
  });

  document.querySelectorAll('[data-del-unit]').forEach(b=>{
    b.onclick = ()=>{
      const u = state.units.find(x=>x.id===b.dataset.delUnit);
      const cnt = state.contacts.filter(c=>c.unitId===u.id).length;
      state.confirmDelete = {type:'unit', id:u.id, message:`Excluir a unidade "${u.name}"? ${cnt>0? cnt+' contato(s) vinculados ficarão sem unidade.' : ''}`};
      render();
    };
  });

  // contact modal
  const contactOverlay = document.getElementById('contactOverlay');
  if(contactOverlay){
    contactOverlay.onclick = (e)=>{ if(e.target===contactOverlay){ closeContactModal(); } };
    document.getElementById('cancelContactBtn').onclick = closeContactModal;
    document.getElementById('saveContactBtn').onclick = async ()=>{
      const name = document.getElementById('f_name').value.trim();
      if(!name){ showToast('Informe o nome do contato'); return; }
      const data = {
        name,
        phone: document.getElementById('f_phone').value.trim(),
        email: document.getElementById('f_email').value.trim(),
        persona: document.getElementById('f_persona').value,
        modality: document.getElementById('f_modality').value,
        unitId: document.getElementById('f_unit').value,
        status: document.getElementById('f_status').value,
        level: document.getElementById('f_level').value,
        planId: document.getElementById('f_planId').value,
        paymentMethod: document.getElementById('f_paymentMethod').value,
        paymentStatus: document.getElementById('f_paymentStatus').value,
        nextDueDate: document.getElementById('f_nextDueDate').value,
        notes: document.getElementById('f_notes').value.trim(),
      };
      if(state.editingContact && state.editingContact.id){
        Object.assign(state.editingContact, data);
      }else{
        state.contacts.push({id:uid(), createdAt: Date.now(), ...data});
      }
      await saveContacts();
      state.showContactModal = false;
      state.editingContact = null;
      render();
      showToast('Contato salvo com sucesso');
    };
  }

  // unit modal
  const unitOverlay = document.getElementById('unitOverlay');
  if(unitOverlay){
    unitOverlay.onclick = (e)=>{ if(e.target===unitOverlay){ closeUnitModal(); } };
    document.getElementById('cancelUnitBtn').onclick = closeUnitModal;
    document.getElementById('saveUnitBtn').onclick = async ()=>{
      const name = document.getElementById('u_name').value.trim();
      if(!name){ showToast('Informe o nome da unidade'); return; }
      const city = document.getElementById('u_city').value.trim();
      if(state.editingUnit && state.editingUnit.id){
        Object.assign(state.editingUnit, {name, city});
      }else{
        state.units.push({id:uid(), name, city});
      }
      await saveUnits();
      state.showUnitModal = false;
      state.editingUnit = null;
      render();
      showToast('Unidade salva com sucesso');
    };
  }

  // class modal
  const classOverlay = document.getElementById('classOverlay');
  if(classOverlay){
    classOverlay.onclick = (e)=>{ if(e.target===classOverlay){ closeClassModal(); } };
    document.getElementById('cancelClassBtn').onclick = closeClassModal;

    const updateClassStudentOptions = ()=>{
      const modality = document.getElementById('cl_modality').value;
      const levelVal = document.getElementById('cl_level').value;
      const rank = LEVEL_RANK[levelVal] ?? 0;
      const studentsSelect = document.getElementById('cl_students');

      if(!cl) return;
      const res = enrollFixed(cl, studentId);
      await saveClasses(); await saveContacts();
      render();
      showToast(res==='waitlist' ? 'Turma lotada — aluno colocado na fila de espera' : 'Aluno adicionado à turma');
    };
    document.querySelectorAll('[data-remove-from-class]').forEach(b=>{
      b.onclick = async ()=>{
        const studentId = b.dataset.removeFromClass;
        const [classId] = (state.attendanceClassId||'').split('|');
        const cl = state.classes.find(c=>c.id===classId);
        if(!cl) return;
        const before = (cl.waitlist||[]).length;
        unenrollFixed(cl, studentId, 'removido pela equipe');
        await saveClasses(); await saveContacts();
        render();
        showToast(before > (cl.waitlist||[]).length ? 'Aluno removido — o primeiro da fila entrou na vaga' : 'Aluno removido da turma');
      };
    });
  }

  // activation modal (plano + turmas antes de aguardar pagamento)
  const activationOverlay = document.getElementById('activationOverlay');
  if(activationOverlay){
    activationOverlay.onclick = (e)=>{ if(e.target===activationOverlay){ closeActivationModal(); } };
    const cancelActivationBtn = document.getElementById('cancelActivationBtn');
    if(cancelActivationBtn) cancelActivationBtn.onclick = closeActivationModal;
    const saveActivationBtn = document.getElementById('saveActivationBtn');
    if(saveActivationBtn) saveActivationBtn.onclick = async ()=>{
      const contact = state.contacts.find(c=>c.id===state.activationContactId);
      if(!contact) return;
      const planId = document.getElementById('act_planId').value;
      if(!planId){ showToast('Selecione um plano'); return; }
      const classIdsSelect = document.getElementById('act_classIds');
      const classIds = classIdsSelect ? Array.from(classIdsSelect.selectedOptions).map(o=>o.value).filter(Boolean) : [];
      const actPlan = state.plans.find(x=>x.id===planId); const actRules = typeof planRules==='function' ? planRules(actPlan) : null;
      if(actRules && actRules.weeklyLimit && classIds.length > actRules.weeklyLimit){ showToast(`O plano ${actPlan.name} permite ${actRules.weeklyLimit} dia(s) por semana. Você selecionou ${classIds.length}.`); return; }
      contact.planId = planId;
      contact.enrolledClassIds = classIds;
      contact.status = 'Aguardando Pagamento';
      await saveContacts();
      state.showActivationModal = false;
      state.activationContactId = null;
      render();
      showToast('Plano salvo — aguardando confirmação de pagamento');
    };
  }
  document.querySelectorAll('[data-confirm-payment]').forEach(b=>{
    b.onclick = async ()=>{
      const contact = state.contacts.find(c=>c.id===b.dataset.confirmPayment);
      if(!contact) return;
      const plan = state.plans.find(p=>p.id===contact.planId);
      contact.status = 'Ativo';
      contact.paymentStatus = 'Em dia';
      await saveContacts();

      // Matricula o aluno em cada turma selecionada
      (contact.enrolledClassIds||[]).forEach(clId=>{
        const cl = state.classes.find(c=>c.id===clId);
        if(cl && !(cl.studentIds||[]).includes(contact.id)){
          const res = enrollFixed(cl, contact.id);
          if(res==='waitlist') showToast(`${classLabel(cl)} está lotada — aluno ficou na fila de espera`);
        }
      });
      await saveClasses();

      // Lança a receita no financeiro
      if(plan){
        state.transactions.push({
          id: uid(),
          type: 'Receita',
          category: plan.name.includes('TAXA') ? 'Matrícula' : plan.name.includes('AVULSA')||plan.name.includes('EXPERIMENTAL') ? 'Aula Avulsa' : plan.name.includes('PARCEIRO') ? 'Plano de Parceria' : 'Mensalidade',
          description: `${plan.name} - ${contact.name}`,
          amount: plan.price,
          date: todayISO(),
          unitId: contact.unitId,
          paymentMethod: contact.paymentMethod||'',
          status: 'Pago',
        });
        await saveTransactions();
      }

      render();
      showToast('Pagamento confirmado! Aluno ativo e matriculado nas turmas.');
    };
  });

  // goals (metas)
  document.querySelectorAll('[data-goal-task-status]').forEach(sel=>{
    sel.onchange = async ()=>{
      const task = state.goals.tasks.find(t=>t.id===sel.dataset.goalTaskStatus);
      if(task){
        task.status = sel.value;
        await saveGoals();
        render();
      }
    };
  });
  document.querySelectorAll('[data-del-goal-task]').forEach(b=>{
    b.onclick = async ()=>{
      state.goals.tasks = state.goals.tasks.filter(t=>t.id!==b.dataset.delGoalTask);
      await saveGoals();
      render();
    };
  });
  document.querySelectorAll('[data-add-goal-task]').forEach(b=>{
    b.onclick = ()=>{
      state.goalTaskResponsavel = b.dataset.addGoalTask;
      state.showGoalTaskModal = true;
      render();
    };
  });
  document.querySelectorAll('[data-goal-check]').forEach(cb=>{
    cb.onchange = async ()=>{
      const item = state.goals.checklist.find(c=>c.id===cb.dataset.goalCheck);
      if(item){
        item.done = cb.checked;
        item.completedDate = cb.checked ? todayISO() : null;
        await saveGoals();
        render();
      }
    };
  });
  document.querySelectorAll('[data-del-goal-check]').forEach(b=>{
    b.onclick = async ()=>{
      state.goals.checklist = state.goals.checklist.filter(c=>c.id!==b.dataset.delGoalCheck);
      await saveGoals();
      render();
    };
  });
  const addGoalChecklistBtn = document.getElementById('addGoalChecklistBtn');
  if(addGoalChecklistBtn) addGoalChecklistBtn.onclick = ()=>{
    state.showGoalChecklistModal = true;
    render();
  };
  const closeGoalMonthBtn = document.getElementById('closeGoalMonthBtn');
  if(closeGoalMonthBtn) closeGoalMonthBtn.onclick = async ()=>{
    const g = state.goals;
    const a = computeGoalActuals(g.month);
    state.goalsHistory.push({
      month: g.month,
      targetTotalActive: g.targetTotalActive, actualTotalActive: a.totalActive,
      targetBnuActive: g.targetBnuActive, actualBnuActive: a.bnuActive,
      targetRevenue: g.targetRevenue, actualRevenue: a.revenueTotal,
    });
    await saveGoalsHistory();
    const nextMonthDate = new Date(g.month+'-01T00:00:00');
    nextMonthDate.setMonth(nextMonthDate.getMonth()+1);
    const nextMonth = nextMonthDate.toISOString().slice(0,7);
    state.goals = {
      ...defaultGoalPeriod(nextMonth),
      targetTotalActive: g.targetTotalActive,
      targetBnuActive: g.targetBnuActive,
      targetRevenue: g.targetRevenue,
      targetRevenueRecurring: g.targetRevenueRecurring,
      targetRevenueNew: g.targetRevenueNew,
      tasks: g.tasks.map(t=>({...t, id:uid(), status:'Não iniciado'})),
      checklist: g.checklist.map(c=>({...c, id:uid(), done:false, completedDate:null})),
    };
    await saveGoals();
    render();
    showToast('Mês fechado e registrado no histórico — novo período iniciado');
  };

  // goal targets modal
  const goalTargetsOverlay = document.getElementById('goalTargetsOverlay');
  if(goalTargetsOverlay){
    goalTargetsOverlay.onclick = (e)=>{ if(e.target===goalTargetsOverlay){ closeGoalTargetsModal(); } };
    document.getElementById('cancelGoalTargetsBtn').onclick = closeGoalTargetsModal;
    document.getElementById('saveGoalTargetsBtn').onclick = async ()=>{
      state.goals.month = document.getElementById('gt_month').value || state.goals.month;
      state.goals.targetTotalActive = Number(document.getElementById('gt_totalActive').value)||0;
      state.goals.targetBnuActive = Number(document.getElementById('gt_bnuActive').value)||0;
      state.goals.targetRevenue = Number(document.getElementById('gt_revenue').value)||0;
      state.goals.targetRevenueRecurring = Number(document.getElementById('gt_revenueRecurring').value)||0;
      state.goals.targetRevenueNew = Number(document.getElementById('gt_revenueNew').value)||0;
      await saveGoals();
      state.showGoalTargetsModal = false;
      render();
      showToast('Metas atualizadas');
    };
  }

  // goal task modal
  const goalTaskOverlay = document.getElementById('goalTaskOverlay');
  if(goalTaskOverlay){
    goalTaskOverlay.onclick = (e)=>{ if(e.target===goalTaskOverlay){ closeGoalTaskModal(); } };
    document.getElementById('cancelGoalTaskBtn').onclick = closeGoalTaskModal;
    document.getElementById('saveGoalTaskBtn').onclick = async ()=>{
      const text = document.getElementById('gtk_text').value.trim();
      if(!text){ showToast('Descreva a tarefa'); return; }
      state.goals.tasks.push({id:uid(), responsavel:state.goalTaskResponsavel, text, status:'Não iniciado'});
      await saveGoals();
      state.showGoalTaskModal = false;
      render();
      showToast('Tarefa adicionada');
    };
  }

  // goal checklist modal
  const goalChecklistOverlay = document.getElementById('goalChecklistOverlay');
  if(goalChecklistOverlay){
    goalChecklistOverlay.onclick = (e)=>{ if(e.target===goalChecklistOverlay){ closeGoalChecklistModal(); } };
    document.getElementById('cancelGoalChecklistBtn').onclick = closeGoalChecklistModal;
    document.getElementById('saveGoalChecklistBtn').onclick = async ()=>{
      const text = document.getElementById('gck_text').value.trim();
      if(!text){ showToast('Descreva a ação'); return; }
      state.goals.checklist.push({id:uid(), text, done:false});
      await saveGoals();
      state.showGoalChecklistModal = false;
      render();
      showToast('Ação adicionada');
    };
  }

  // confirm delete
  const confirmOverlay = document.getElementById('confirmOverlay');
  if(confirmOverlay){
    confirmOverlay.onclick = (e)=>{ if(e.target===confirmOverlay){ state.confirmDelete=null; render(); } };
    document.getElementById('cancelDeleteBtn').onclick = ()=>{ state.confirmDelete=null; render(); };
    document.getElementById('confirmDeleteBtn').onclick = async ()=>{
      const d = state.confirmDelete;
      if(d.type==='contact'){
        state.contacts = state.contacts.filter(c=>c.id!==d.id);
        await saveContacts();
      }else if(d.type==='class'){
        state.classes = state.classes.filter(cl=>cl.id!==d.id);
        await saveClasses();
      }else if(d.type==='transaction'){
        state.transactions = state.transactions.filter(t=>t.id!==d.id);
        await saveTransactions();
      }else if(d.type==='plan'){
        state.plans = state.plans.filter(p=>p.id!==d.id);
        await savePlans();
      }else if(d.type==='booking'){
        state.bookings = state.bookings.filter(b=>b.id!==d.id);
        await saveBookings();
      }else if(d.type==='evaluation'){
        state.evaluations = state.evaluations.filter(e=>e.id!==d.id);
        await saveEvaluations();
      }else if(d.type==='instructor'){
        state.instructors = state.instructors.filter(i=>i.id!==d.id);
        await saveInstructors();
      }else if(d.type==='unit'){
        state.units = state.units.filter(u=>u.id!==d.id);
        state.contacts.forEach(c=>{ if(c.unitId===d.id) c.unitId=''; });
        await saveUnits();
        await saveContacts();
      }
      state.confirmDelete = null;
      render();
      showToast('Excluído com sucesso');
    };
  }

  // drag and drop pipeline
  document.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain', card.dataset.id);
    });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });
  document.querySelectorAll('.kcol').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', async e=>{
      e.preventDefault();
      col.classList.remove('dragover');
      const id = e.dataTransfer.getData('text/plain');
      const contact = state.contacts.find(c=>c.id===id);
      if(!contact) return;
      const targetStatus = col.dataset.status;
      if((targetStatus==='Ativo' || targetStatus==='Aguardando Pagamento') && contact.status!==targetStatus){
        // Antes de virar Ativo/Aguardando Pagamento, exige selecionar plano e turmas de treino
        state.activationContactId = contact.id;
        state.showActivationModal = true;
        render();
        return;
      }
      contact.status = targetStatus;
      await saveContacts();
      render();
    });
  });
}

}
function platformLogoSVG(size=34){

}

function fmtDateBR(iso){ return iso ? new Date(iso.length<=10 ? iso+'T00:00:00' : iso).toLocaleDateString('pt-BR') : '—'; }
function fmtDateTimeBR(iso){ const d = new Date(iso); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

}

/* ---------------- RBAC ---------------- */
function roleHas(role, perm){
  if(!role) return false;
  if(role.perms.includes('*')) return true;
  return role.perms.includes(perm) || role.perms.includes(perm.split('.')[0]+'.*');
}
function grantingAssignments(perm){
  const m = currentMembership(); if(!m) return [];
  return m.roles.filter(a=> roleHas(getRole(a.roleId), perm));
}
function planBlockReason(perm){
  const tn = currentTenant(); if(!tn) return null;
  const action = perm.split('.')[1];
  if(tn.status==='Suspenso' && action!=='view') return 'Assinatura suspensa: o CT está em modo somente leitura';
  if(perm==='unidades.create'){
    const plan = SAAS_PLANS[tn.saasPlan];
    if(plan && state.units.length >= plan.units) return `Plano ${tn.saasPlan}: limite de ${plan.units} unidade(s). Faça upgrade para adicionar mais.`;
  }
  return null;
}
// Permissão efetiva = (soma das funções do usuário) ∩ (o que o plano/estado do CT libera)
function can(perm){
  if(grantingAssignments(perm).length===0) return false;
  return !planBlockReason(perm);
}
function permScope(mod){
  const list = grantingAssignments(mod+'.view');
  if(list.length===0) return 'TENANT';
  let widest = 'OWN';
  list.forEach(a=>{ const r = getRole(a.roleId); const sc = r.perms.includes('*') ? 'TENANT' : (r.scopes||{})[mod] || 'TENANT'; if(sc==='TENANT') widest = 'TENANT'; });
  return widest;
}
function allowedUnitIds(){
  const m = currentMembership(); if(!m || m.support) return null;
  const staff = m.roles.filter(a=> { const r = getRole(a.roleId); return r && !(r.perms.length===1 && r.perms[0]==='minha_area.view'); });
  if(staff.length===0) return null;
  if(staff.some(a=> !a.unitId)) return null;
  return new Set(staff.map(a=>a.unitId));
}
function applyUnitRestriction(){
  const allowed = allowedUnitIds();
  if(allowed && (state.unitFilter==='all' || !allowed.has(state.unitFilter))) state.unitFilter = [...allowed][0];
}
function tabAllowed(tabId){
  const t = NAV_TABS.find(x=>x.id===tabId); if(!t) return false;
  if(tabId==='platform'){ const u = currentUser(); return !!(u && u.platformAdmin); }
  if(!CURRENT_TENANT) return false;
  // telas pessoais só aparecem para quem tem vínculo (cadastro de aluno / professor)
  if(tabId==='student' && !(currentMembership()||{}).contactId) return false;
  if(tabId==='my_classes' && !myInstructorName()) return false;
  return grantingAssignments(t.mod+'.view').length>0;
}
function visibleNavTabs(){

}

  if(tabAllowed('dashboard') && (!tabAllowed('my_classes') || can('acessos.view'))) return 'dashboard';
  if(tabAllowed('student') && !tabAllowed('dashboard')) return 'student';

/* ---------------- Aulas, confirmações e solicitações ---------------- */
function sessionStart(date, time){ return new Date(`${date}T${time||'00:00'}:00`); }
function upcomingSessions(classes, days){
  const out = []; const now = new Date(); const today = todayISO();
  for(let d=0; d<days; d++){
    const date = addDaysISO(today, d); const wd = weekdayName(date);
    classes.filter(cl=> cl.day===wd && cl.active!==false && (!cl.validFrom || cl.validFrom <= date)).forEach(cl=>{
      const end = sessionStart(date, cl.endTime || cl.startTime);
      if(end < now) return;
      out.push({cl, date, start: sessionStart(date, cl.startTime), exc: getException(cl.id, date)});
    });
  }
  return out.sort((a,b)=> a.start-b.start);
}
function confKey(classId, date, contactId){ return `${CURRENT_TENANT}|${classId}|${date}|${contactId}`; }
function getConf(classId, date, contactId){ return PLATFORM.confirmations[confKey(classId,date,contactId)] || null; }

/* ======================= Regras inspiradas no Tecnofit =======================
   Turma: janela de check-in (abre/fecha), prazo de cancelamento, fila on/off,
          aceita avulso / reposição / experimental (com limite por aula).
   Contrato (plano): tipo de vencimento, sessões, validade, renovação, limites
          por dia/semana, turmas liberadas, reposições (qtd e prazo), licença.
   Check-in: validado contra turma + contrato + inadimplência. Quem tem a
          permissão "Check-in livre" pode passar por cima das validações.     */
function settingsCfg(){
  return Object.assign({blockOverdue:true, overdueGraceDays:3, riskDays:14, reminderHours:3, lowOccupancyAlert:true,
    absencesCountOccupancy:true, customHolidays:[], autoMessages:{lembrete:true, vencimento:true, falta:true, aniversario:true, experimental:true, ausencia:true}}, state.settings||{});
}

function typeCfg(t){
  return Object.assign({interval:0, waitlistDay:true, waitlistFixed:true, allowProspect:true, maxProspect:2, allowDropIn:true, maxDropIn:8,
    allowMakeup:true, maxMakeup:8, checkinOpenMin:0, checkinCloseMin:15, cancelMin:120, showApp:true, showSite:false}, (t&&t.cfg)||{});
}
function clCfg(cl){ return typeCfg(typeOf(cl)); }
function checkinWindow(cl, date){
  const c = clCfg(cl); const start = sessionStart(date, cl.startTime); const now = new Date();
  const opens = c.checkinOpenMin>0 ? new Date(start - c.checkinOpenMin*60000) : null;
  const closes = new Date(+start + c.checkinCloseMin*60000);
  const cancelUntil = new Date(start - c.cancelMin*60000);
  return {start, opens, closes, cancelUntil, canCheckin: (!opens || now >= opens) && now <= closes, canCancel: now <= cancelUntil, notOpenYet: opens && now < opens};
}

function defaultPlanRules(p){
  const n = (p.name||'').toUpperCase(); const bill = p.billing||'';
  const wk = n.match(/(\d)X NA SEMANA/); const weekly = wk ? +wk[1] : null;
  const isSession = /Sess/i.test(bill); const sm = bill.match(/(\d+)\s*sess/i);
  const months = /ANUAL/.test(n)?12 : /SEMESTRAL/.test(n)?6 : /TRIMESTRAL/.test(n)?3 : 1;
  const single = /AVULSA|EXPERIMENTAL|NIVELAMENTO|MATRICULA|MATRÍCULA/.test(n);
  return {kind: /vencimento fixo/i.test(bill) ? 'Mensal (vencimento fixo)' : isSession ? 'Por sessão' : 'Por período',
    sessions: isSession ? (sm ? +sm[1]*(/por semana/i.test(bill)?4:1) : (weekly ? weekly*4 : 1)) : null,
    validityDays: single ? (/AVULSA|EXPERIMENTAL/.test(n) ? 1 : 30) : months*30,
    autoRenew: !single, adhesion: single ? 0 : 40, extraSession: 45,
    weeklyLimit: weekly, dailyLimit: 1,
    makeupQty: single ? 0 : (weekly ? weekly*2 : 4), makeupDays: 15, autoMakeupOnNotice: true,
    allowedTypeIds: null, hourFrom:'00:00', hourTo:'23:59',
    licenseDays: months>=6 ? 30 : 0, licenseTimes: months>=6 ? 1 : 0, installments: months>=3, onlineSale: false};
}
function planRules(p){ return p ? Object.assign(defaultPlanRules(p), p.rules||{}) : null; }
function contractOf(c){
  const p = c && state.plans.find(x=> x.id===c.planId); if(!p) return null;
  const r = planRules(p); const today = todayISO();
  let end = c.nextDueDate || addDaysISO(today, r.validityDays);
  let renewed = 0;
  // renovação automática: o contrato vencido gera o próximo período (como no Tecnofit)
  if(r.autoRenew){ while(end <= today && renewed < 60){ end = addDaysISO(end, r.validityDays); renewed++; } }
  const start = addDaysISO(end, -r.validityDays);
  let used = 0;
  Object.entries(state.attendanceRecords).forEach(([k,rec])=>{ const d = k.split('|')[1]; if(d>=start && d<end && rec && rec[c.id]==='Presente') used++; });
  Object.entries(state.sessionBookings||{}).forEach(([k,b])=>{ const d = k.split('|')[1]; if(d>=today && d>=start && d<end && (b.accepted||[]).some(a=> a.contactId===c.id && a.kind!=='Reposição')) used++; });
  const status = c.license && c.license.until >= today ? 'Licença' : today < start ? 'Aguardando início' : today >= end ? (r.autoRenew ? 'Renovação pendente' : 'Vencido') : 'Ativo';
  const autoMakeups = (state.makeups||[]).filter(m=> m.contactId===c.id && m.origin==='aviso' && m.date>=start && m.date<end).length;
  return {plan:p, rules:r, start, end, used, total:r.sessions, status, renewed, makeupsLeft: Math.max(0, r.makeupQty - autoMakeups)};
}
function bookingsOfStudent(contactId, from, to){
  const out = [];
  Object.entries(state.sessionBookings||{}).forEach(([k,b])=>{ const [cid, d] = k.split('|'); if(d>=from && d<=to) (b.accepted||[]).forEach(a=>{ if(a.contactId===contactId) out.push({cid, date:d, kind:a.kind}); }); });
  return out;
}
function validateCheckin(c, cl, date, kind){
  const errors = []; const t = clCfg(cl); const w = checkinWindow(cl, date); const st = settingsCfg();
  if(cancelInfo(cl, date)) errors.push('Aula cancelada nesta data');
  if(w.notOpenYet) errors.push(`O check-in abre ${fmtMin(t.checkinOpenMin)} antes da aula`);
  if(new Date() > w.closes) errors.push('O check-in desta aula já encerrou');
  if(kind==='Experimental'){ if(!t.allowProspect) errors.push('Esta turma não aceita aula experimental');
    else if(peekBooking(cl,date).accepted.filter(a=> a.kind==='Experimental').length >= t.maxProspect) errors.push(`Limite de ${t.maxProspect} experimental(is) por aula`);
    return {ok:!errors.length, errors}; }
  if(!c){ errors.push('Aluno não encontrado'); return {ok:false, errors}; }
  if(st.blockOverdue && c.paymentStatus==='Atrasado' && (!c.nextDueDate || c.nextDueDate < addDaysISO(todayISO(), -st.overdueGraceDays)))
    errors.push(`Restrição por inadimplência: pagamento em atraso (tolerância de ${st.overdueGraceDays} dia(s) esgotada)`);
  const ct = contractOf(c);
  if(!ct) errors.push('Sem contrato/plano ativo');
  else {
    if(!['Ativo'].includes(ct.status)) errors.push(`Contrato ${ct.status.toLowerCase()} (${fmtDateBR(ct.start)} a ${fmtDateBR(ct.end)})`);
    if(ct.rules.allowedTypeIds && ct.rules.allowedTypeIds.length && !ct.rules.allowedTypeIds.includes(cl.typeId)) errors.push(`O plano ${ct.plan.name} não dá acesso a esta turma`);
    if(kind!=='Reposição'){
      if(ct.rules.sessions && ct.used >= ct.rules.sessions) errors.push(`Sessões do contrato esgotadas (${ct.used}/${ct.rules.sessions})`);
      const ws = weekStart(date), we = addDaysISO(ws, 6);
      const wk = bookingsOfStudent(c.id, ws, we).filter(x=> x.kind!=='Reposição' && !(x.cid===cl.id && x.date===date)).length;
      if(ct.rules.weeklyLimit && wk >= ct.rules.weeklyLimit) errors.push(`Limite do plano: ${ct.rules.weeklyLimit}x por semana (já tem ${wk} nesta semana)`);
      const dy = bookingsOfStudent(c.id, date, date).filter(x=> !(x.cid===cl.id)).length;
      if(ct.rules.dailyLimit && dy >= ct.rules.dailyLimit) errors.push(`Limite do plano: ${ct.rules.dailyLimit} aula(s) por dia`);
    }
    if(cl.startTime < ct.rules.hourFrom || cl.startTime > ct.rules.hourTo) errors.push(`O plano só permite horários entre ${ct.rules.hourFrom} e ${ct.rules.hourTo}`);
  }
  const acc = peekBooking(cl, date).accepted;
  if(kind==='Avulso'){ if(!t.allowDropIn) errors.push('Esta turma não aceita aula avulsa'); else if(acc.filter(a=> a.kind==='Avulso').length >= t.maxDropIn) errors.push(`Limite de ${t.maxDropIn} avulso(s) por aula`); }
  if(kind==='Reposição'){ if(!t.allowMakeup) errors.push('Esta turma não aceita reposição'); else if(acc.filter(a=> a.kind==='Reposição').length >= t.maxMakeup) errors.push(`Limite de ${t.maxMakeup} reposição(ões) por aula`); }
  return {ok:!errors.length, errors};
}
function kindFor(cl, contactId){
  const c = state.contacts.find(x=>x.id===contactId);
  if((cl.studentIds||[]).includes(contactId)) return 'Agenda fixa';
  if(c && !['Ativo','Parceiro Fechado'].includes(c.status)) return 'Experimental';
  return 'Avulso';
}
function grantAutoMakeup(c, cl, date){
  const ct = contractOf(c);
  if(!ct || !ct.rules.autoMakeupOnNotice || ct.makeupsLeft<=0) return null;
  const m = {id:'mk_'+uid(), contactId:c.id, classId:cl.id, date, createdAt:nowISO(), status:'Liberada', origin:'aviso', code:makeupCode(),
    grantedBy:'Automático (aviso antecipado)', grantedAt:nowISO(), expiresAt:addDaysISO(date, ct.rules.makeupDays), grantNote:`Cota do plano: ${ct.makeupsLeft-1} restante(s)`};
  state.makeups.push(m);
  notifyContact(c.id, `Você avisou a tempo que não vai em ${fmtDateBR(date)} ${cl.startTime}. Ganhou uma reposição (código ${m.code}) válida até ${fmtDateBR(m.expiresAt)}.`);
  audit('Reposição automática (aviso antecipado)', `${c.name} · ${classLabel(cl)} ${fmtDateBR(date)} · ${m.code}`);
  return m;
}
function pendingRequestsCount(){
  if(!CURRENT_TENANT || !tabAllowed('requests')) return 0;
  const jus = can('reposicoes.view') ? visibleMakeups().filter(m=> m.status==='Aguardando análise').length : 0;
  return visibleRequests().filter(r=> r.status==='Pendente').length + jus;
}
function visibleRequests(){
  const allowed = allowedUnitIds();
  return PLATFORM.requests.filter(r=> r.tenantId===CURRENT_TENANT).filter(r=>{
    if(!allowed) return true;
    const c = state.contacts.find(x=>x.id===r.contactId);
    return c && allowed.has(c.unitId);
  });
}
function notifyContact(contactId, text){
  PLATFORM.memberships.filter(m=> m.tenantId===CURRENT_TENANT && m.contactId===contactId).forEach(m=>{
    PLATFORM.notifications.unshift({id:uid(), tenantId:CURRENT_TENANT, userId:m.userId, text, createdAt:nowISO(), read:false});
  });
}
function classLabel(cl){ return cl ? `${cl.day} ${cl.startTime||''}${cl.endTime?'–'+cl.endTime:''} · ${cl.name}` : '—'; }
function dayLabel(date){
  const d = new Date(date+'T00:00:00');
  const t = todayISO();
  if(date===t) return 'Hoje';
  if(date===addDaysISO(t,1)) return 'Amanhã';
  return d.toLocaleDateString('pt-BR',{weekday:'short', day:'2-digit', month:'2-digit'});
}
function needsConsent(){
  const m = currentMembership(); const u = currentUser();
  if(!m || m.support || !m.contactId) return false;
  return !PLATFORM.consents.some(c=> c.userId===u.id && c.tenantId===CURRENT_TENANT && c.version==='v1');
}

/* ---------------- Tela: Minhas turmas (professor) ---------------- */
function renderMyClasses(){
  const me = myInstructorName();
  if(!me) return `<div class="empty">Seu usuário não está vinculado a um professor neste CT. Peça ao admin para vincular em “Usuários e acessos”.</div>`;
  const mine = state.classes.filter(cl=> cl.active!==false && instructorsOf(cl).includes(me));
  const sessions = upcomingSessions(mine, 7);
  const byDate = {};
  sessions.forEach(s=> (byDate[s.date] = byDate[s.date] || []).push(s));
  const total = new Set(mine.flatMap(cl=> cl.studentIds||[])).size;
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Turmas semanais</div><div class="value">${mine.length}</div></div>
    <div class="stat-card"><div class="label">Alunos</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">Aulas nos próximos 7 dias</div><div class="value">${sessions.length}</div></div>
  </div>
  ${Object.keys(byDate).length ? Object.keys(byDate).map(date=>`
    <h3 class="mc-day">${esc(dayLabel(date))}${['Hoje','Amanhã'].includes(dayLabel(date)) ? ' · '+fmtDateBR(date) : ''}</h3>
    <div class="mc-list">
    ${byDate[date].map(s=>{
      const ros = sessionRoster(s.cl, s.date);
      const students = [...ros.accIds, ...ros.pending, ...ros.declined].map(id=> state.contacts.find(c=>c.id===id)).filter(Boolean);
      const vou = ros.accIds.length;
      const nao = ros.declined.length;
      const att = state.attendanceRecords[`${s.cl.id}|${s.date}`];
      const done = att && Object.keys(att).length>0;
      return `
      <div class="panel mc-card">
        <div class="mc-head">
          <div><div class="mc-time">${esc(s.cl.startTime)}–${esc(s.cl.endTime||'')}</div><div class="mc-name">${esc(s.cl.name)}</div><div class="mc-meta">${esc(unitName(s.cl.unitId))} · ${esc(s.cl.modality)} · ${ros.occ}/${ros.cap} vagas${ros.waitlist.length?` · fila ${ros.waitlist.length}`:''}</div></div>
          <div class="mc-counts"><span class="mc-c ok" title="confirmados">✓ ${vou}/${ros.cap}</span>${ros.waitIds.length?`<span class="mc-c" title="fila">fila ${ros.waitIds.length}</span>`:''}<span class="mc-c no" title="não vão">✗ ${nao}</span><span class="mc-c" title="sem resposta">? ${ros.pending.length}</span></div>
        </div>
        <div class="mc-students">
          ${students.length ? students.map(st=>{ const cf = getConf(s.cl.id, s.date, st.id);
            const accPos = ros.accIds.indexOf(st.id), wPos = ros.waitIds.indexOf(st.id);
            const cf2 = accPos>=0 ? `${accPos+1}º confirmado` : wPos>=0 ? `fila ${wPos+1}º` : (getConf(s.cl.id, s.date, st.id)==='Não vou' ? 'não vai' : 'sem resposta');
            return `<div class="mc-st"><span>${levelDot(normalizeLevel(st.level))} ${esc(st.name)}</span><span class="mc-st-r"><span class="mc-phone" data-sensitive>${esc(st.phone||'—')}</span><span class="mc-conf ${accPos>=0?'ok':cf2==='não vai'?'no':''}">${esc(cf2)}</span><button class="btn btn-ghost btn-sm" data-open-ficha="${st.id}">Ficha</button></span></div>`; }).join('')
            : `<div class="empty" style="padding:12px;">Sem alunos matriculados.</div>`}
          ${waitlistBlock(s.cl, s.date)}
        </div>
        ${s.exc ? `<div class="pill req-Recusada" style="text-align:center;">Aula cancelada · ${esc(s.exc.reason)}</div>` : `<div style="display:flex;gap:6px;"><button class="btn btn-ghost btn-sm" style="flex:1;" data-act="open-session" data-id="${s.cl.id}" data-date="${s.date}">Gerenciar lista e fila</button>${s.start <= new Date() ? `<button class="btn ${done?'btn-ghost':'btn-primary'} btn-sm" style="flex:1;" data-open-attendance="${s.cl.id}|${s.date}">${done?'✓ Chamada feita':'Fazer chamada'}</button>`:''}</div>`}
      </div>`; }).join('')}
    </div>`).join('') : `<div class="empty">Nenhuma aula sua nos próximos 7 dias.</div>`}`;
}

/* ---------------- Cadastro de aluno por link (público) ----------------
   Link geral do CT (reutilizável) ou convite individual (uso único, pré-preenchido).
   O aluno preenche os dados, cria a senha e aceita os termos. A conta nasce com a
   função Aluno vinculada ao cadastro. CPF validado e único por CT.               */
function inviteToken(){ const ch = 'abcdefghjkmnpqrstuvwxyz23456789'; let t = ''; for(let i=0;i<10;i++) t += ch[Math.floor(Math.random()*ch.length)]; return t; }
function inviteLink(inv){ return location.href.split('#')[0] + '#cadastro/' + inv.token; }
function copyText(t){ try{ navigator.clipboard && navigator.clipboard.writeText(t).catch(()=>{}); }catch(e){} }
function ensureGeneralInvite(tid){
  PLATFORM.invites = PLATFORM.invites || [];
  let g = PLATFORM.invites.find(x=> x.tenantId===tid && x.reusable && x.status==='Ativo');
  if(!g){ g = {token: inviteToken(), tenantId: tid, reusable:true, createdBy:'sistema', createdAt: nowISO(), expiresAt:'2099-12-31', status:'Ativo', prefill:{}, uses:0}; PLATFORM.invites.push(g); savePlatform(); }
  return g;
}
function cpfValid(v){
  const d = String(v||'').replace(/\D/g,''); if(d.length!==11 || /^(\d)\1+$/.test(d)) return false;
  const calc = n=>{ let s = 0; for(let i=0;i<n;i++) s += +d[i]*(n+1-i); const r = (s*10)%11; return r===10 ? 0 : r; };
  return calc(9)===+d[9] && calc(10)===+d[10];
}
function fmtCPF(v){ const d = String(v||'').replace(/\D/g,'').slice(0,11); return d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function fmtPhone(v){ const d = String(v||'').replace(/\D/g,'').slice(0,11); return d.length>10 ? d.replace(/(\d{2})(\d{5})(\d{4})/,'($1) $2-$3') : d.replace(/(\d{2})(\d{4})(\d{0,4})/,'($1) $2-$3'); }
function ageFrom(iso){ if(!iso) return null; const b = new Date(iso+'T00:00:00'), n = new Date(); let a = n.getFullYear()-b.getFullYear(); if(n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; }
function tenantData(tid, key){
  if(CURRENT_TENANT===tid && state.loaded && Array.isArray(state[key])) return state[key];
  try{ return JSON.parse(LS.get(tkey(key, tid))||'[]'); }catch(e){ return []; }
}
function demoCPF(){ const n = Array.from({length:9}, ()=> Math.floor(Math.random()*10));
  const dv = arr=>{ let s=0; for(let i=0;i<arr.length;i++) s += arr[i]*(arr.length+1-i); const r=(s*10)%11; return r===10?0:r; };
  n.push(dv(n)); n.push(dv(n)); return fmtCPF(n.join('')); }

function readSignup(){
  const S = state.signup; if(!S) return;
  const v = id=>{ const el = document.getElementById('su_'+id); return el ? (el.type==='checkbox' ? el.checked : el.value) : undefined; };
  const map = {name:'name', cpf:'cpf', birth:'birth', phone:'phone', gender:'gender', unit:'unitId', mod:'modality', exp:'experience', gname:'gname', gcpf:'gcpf', gphone:'gphone',
    cep:'cep', city:'city', street:'street', district:'district', ename:'ename', ephone:'ephone', source:'source', email:'email', pass:'pass', pass2:'pass2', terms:'terms', rules:'rules', mkt:'mkt'};
  Object.entries(map).forEach(([id,k])=>{ const x = v(id); if(x!==undefined) S.d[k] = typeof x==='string' ? x.trim() : x; });
}
function validateSignupStep(inv){
  const S = state.signup, d = S.d, e = {}; const tid = inv.tenantId;
  if(S.step===1){
    if((d.name||'').split(/\s+/).filter(Boolean).length < 2) e.name = 'Informe nome e sobrenome';
    if(!cpfValid(d.cpf)) e.cpf = 'CPF inválido';
    else if(tenantData(tid,'contacts').some(c=> (c.cpf||'').replace(/\D/g,'')===d.cpf.replace(/\D/g,''))) e.cpf = 'Já existe um aluno com este CPF neste CT. Faça login ou fale com a recepção.';
    const a = ageFrom(d.birth);
    if(!d.birth || a==null || a<3 || a>110) e.birth = 'Data de nascimento inválida';
    if(String(d.phone||'').replace(/\D/g,'').length < 10) e.phone = 'Celular inválido';
    if(a!=null && a<18){
      if(!d.gname) e.gname = 'Obrigatório para menores';
      if(!cpfValid(d.gcpf)) e.gcpf = 'CPF do responsável inválido';
      if(String(d.gphone||'').replace(/\D/g,'').length < 10) e.gphone = 'Celular inválido';
    }
    d.cpf = fmtCPF(d.cpf); d.phone = fmtPhone(d.phone); if(d.gcpf) d.gcpf = fmtCPF(d.gcpf); if(d.gphone) d.gphone = fmtPhone(d.gphone);
  }
  if(S.step===2){
    if(!d.ename) e.ename = 'Informe um contato de emergência';
    if(String(d.ephone||'').replace(/\D/g,'').length < 10) e.ephone = 'Celular inválido';
    d.ephone = fmtPhone(d.ephone);
  }
  if(S.step===3){
    const email = (d.email||'').toLowerCase(); d.email = email;
    if(!/^\S+@\S+\.\S+$/.test(email)) e.email = 'Email inválido';
    const u = PLATFORM.users.find(x=> x.email===email);
    S.existingAccount = !!u;
    if(u && PLATFORM.memberships.some(m=> m.userId===u.id && m.tenantId===tid && m.status!=='Removido')) e.email = 'Este email já tem cadastro neste CT. Faça login.';
    else if(u){ if(d.pass && d.pass!==u.password) e.pass = 'Senha atual incorreta'; else if(!d.pass) e.pass = 'Digite sua senha atual'; }
    else {
      if(!d.pass || d.pass.length<8 || !/[a-zA-Z]/.test(d.pass) || !/\d/.test(d.pass)) e.pass = 'Use 8+ caracteres com letras e números';
      if(d.pass!==d.pass2) e.pass2 = 'As senhas não conferem';
    }
  }
  if(S.step===4){ if(!d.terms) e.terms = 'Obrigatório'; if(!d.rules) e.rules = 'Obrigatório'; }
  S.errors = e; return !Object.keys(e).length;
}
function finishSignup(inv){
  const S = state.signup, d = S.d; const tid = inv.tenantId;
  const contact = {id:'c_'+uid(), name:d.name, cpf:d.cpf, birthDate:d.birth, gender:d.gender, phone:d.phone, email:d.email, persona: d.experience==='Nunca joguei'?'Iniciante':'Praticante',
    modality:d.modality, unitId:d.unitId, status: inv.prefill.planId ? 'Aguardando Pagamento' : 'Inscrito', level: suggestLevel(d.experience==='Nunca joguei'?'Não':'Sim', d.experience) || 'Branca',
    planId: inv.prefill.planId||'', paymentMethod:'', paymentStatus:'Em dia', nextDueDate:'', source:d.source, alreadyPlays: d.experience==='Nunca joguei'?'Não':'Sim', experience:d.experience,
    address:{cep:d.cep, street:d.street, district:d.district, city:d.city}, emergency:{name:d.ename, phone:d.ephone},
    guardian: d.gname ? {name:d.gname, cpf:d.gcpf, phone:d.gphone} : null, marketingOptIn: !!d.mkt,
    notes:`Cadastro pelo link (${inv.reusable?'link geral':'convite '+inv.token}).`, createdVia:'link', createdAt: nowISO(), enrolledClassIds:[]};
  if(CURRENT_TENANT===tid && state.loaded){ state.contacts.push(contact); saveContacts(); flushAllSaves(); }
  else { const list = tenantData(tid,'contacts'); list.push(contact); LS.set(tkey('contacts', tid), JSON.stringify(list)); }
  let u = PLATFORM.users.find(x=> x.email===d.email);
  if(!u){ u = {id:'u_'+uid(), name:d.name, email:d.email, password:d.pass}; PLATFORM.users.push(u); }
  const alunoRole = PLATFORM.roles.find(r=> r.tenantId===tid && r.name==='Aluno' && !r.deletedAt);
  PLATFORM.memberships.push({id:'m_'+uid(), tenantId:tid, userId:u.id, status:'Ativo', contactId:contact.id,
    roles:[{id:uid(), roleId: alunoRole ? alunoRole.id : `${tid}_aluno`, unitId:null, grantedBy:'cadastro por link', grantedAt:nowISO()}]});
  PLATFORM.consents.push({userId:u.id, tenantId:tid, version:'v1', acceptedAt:nowISO(), by: d.gname ? 'responsável: '+d.gname : 'titular', regulamento:true, marketing:!!d.mkt});
  if(inv.reusable) inv.uses = (inv.uses||0)+1; else { inv.status = 'Usado'; inv.usedAt = nowISO(); inv.usedByName = d.name; }
  const prevTenant = CURRENT_TENANT; CURRENT_TENANT = tid;
  PLATFORM.audit.unshift({id:uid(), at:nowISO(), tenantId:tid, userId:u.id, userName:d.name+' (cadastro público)', action:'Aluno se cadastrou pelo link', detail:`${d.name} · CPF ${d.cpf} · ${inv.reusable?'link geral':'convite '+inv.token}`});
  CURRENT_TENANT = prevTenant;
  savePlatform();
  S.done = true; S.userId = u.id;
}
function attachSignupEvents(){
  const inv = (PLATFORM.invites||[]).find(x=> x.token===state.signupToken);
  const exit = ()=>{ state.signupToken = null; state.signup = null; if((location.hash||'').startsWith('#cadastro')) history.replaceState(null,'',location.href.split('#')[0]); applyTenantConfig(); render(); };
  document.querySelectorAll('[data-su]').forEach(el=> el.onclick = async ()=>{
    const a = el.dataset.su;
    if(a==='exit') return exit();
    if(a==='login'){ if(state.signupPreview) return exit(); doLogout(); return exit(); }
    if(a==='fill'){ readSignup(); Object.assign(state.signup.d, {name: state.signup.d.name || 'Marina Teste Souza', cpf: demoCPF(), birth:'1995-06-15', phone: state.signup.d.phone || '(47) 99876-5432', experience:'Menos de 6 meses'}); state.signup.errors = {}; return render(); }
    if(a==='back'){ readSignup(); state.signup.step--; state.signup.errors = {}; return render(); }
    if(a==='next'){
      readSignup();
      if(!validateSignupStep(inv)) return render();
      if(state.signup.step<4){ state.signup.step++; return render(); }
      finishSignup(inv); return render();
    }
    if(a==='enter'){
      const uid2 = state.signup.userId; const tid = inv.tenantId;
      state.signupToken = null; state.signup = null; state.signupPreview = false;
      if((location.hash||'').startsWith('#cadastro')) history.replaceState(null,'',location.href.split('#')[0]);
      flushAllSaves(); setSession({userId:uid2, tenantId:tid}); CURRENT_TENANT = tid;
      await enterTenant(tid);
    }
  });
  const cep = document.getElementById('su_cep');
  if(cep) cep.onblur = async ()=>{
    const d = cep.value.replace(/\D/g,''); if(d.length!==8) return;
    try{ const r = await fetch(`https://viacep.com.br/ws/${d}/json/`); const j = await r.json(); if(!j.erro){
      const set = (id,v)=>{ const el = document.getElementById(id); if(el && !el.value) el.value = v; };
      set('su_city', `${j.localidade}/${j.uf}`); set('su_street', j.logradouro||''); set('su_district', j.bairro||''); } }catch(e){}
  };
  ['su_cpf','su_gcpf'].forEach(id=>{ const el = document.getElementById(id); if(el) el.oninput = ()=>{ el.value = fmtCPF(el.value); }; });
  ['su_phone','su_gphone','su_ephone'].forEach(id=>{ const el = document.getElementById(id); if(el) el.oninput = ()=>{ el.value = fmtPhone(el.value); }; });
}

// Nivelamento: arrastar o card entre as colunas (mesma lógica do pipeline)
async function changeLevel(contact, to){
  const from = normalizeLevel(contact.level);
  if(from===to) return;
  const up = LEVEL_RANK[to] > LEVEL_RANK[from];
  const meta = LEVEL_META[to];
  if(meta && meta.requiresApproval && !can('nivelamento.update')){ showToast(`A pulseira ${to} exige aprovação`); render(); return; }
  const elig = contactEligible(contact);
  contact.level = to;
  contact.levelHistory = [...(contact.levelHistory||[]), {from, to, at: nowISO(), by: currentUser()?currentUser().name:'', withScore: contactScore(contact)}];
  if(up) notifyContact(contact.id, `Parabéns! Você subiu para a pulseira ${levelLabel(to)}.`);
  audit(up ? 'Promoveu pulseira' : 'Rebaixou pulseira', `${contact.name}: ${from} → ${to}${up && !elig ? ' (sem atingir a pontuação)' : ''}`);
  await saveContacts(); render();
  showToast(up ? (elig || LEVEL_RANK[to]-LEVEL_RANK[from]>1 ? `${contact.name.split(' ')[0]} subiu para ${to}` : `${contact.name.split(' ')[0]} subiu para ${to} sem atingir a pontuação mínima`) : `${contact.name.split(' ')[0]} voltou para ${to}`);
}
function attachLevelDrag(){
  const canMove = can('nivelamento.update');
  document.querySelectorAll('.lv-card').forEach(card=>{
    if(!canMove){ card.setAttribute('draggable','false'); return; }
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.dataset.lvId); card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });
  if(!canMove) return;
  document.querySelectorAll('[data-level-col]').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove('dragover'); });
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const c = state.contacts.find(x=> x.id===e.dataTransfer.getData('text/plain'));
      if(c) changeLevel(c, col.dataset.levelCol);
    });
  });
}

  if(!s || !u){ setSession(null); state.loaded = true; render(); return; }
  if(s.tenantId && !PLATFORM.tenants.some(t=>t.id===s.tenantId)){ setSession(null); state.loaded = true; render(); return; }
  CURRENT_TENANT = s.tenantId || null;
  await enterTenant(CURRENT_TENANT);
}


/* =====================================================================
   DEMO — Turmas (cadastro) + Aulas (agenda) no modelo do Tecnofit,
   lotação com fila de espera e frequência no dashboard
   ---------------------------------------------------------------------
   Turma  = tipo de aula: nome, vagas, duração, observação, cor, ícone
   Aula   = agenda da turma: recorrente/única, dias, horários, feriados,
            professores (1..n), vagas (padrão da turma), observações.
            Cada dia+horário vira um registro (classes) com o mesmo seriesId.
   Fila   = fila da matrícula fixa (cl.waitlist) e fila do dia
            (sessionBookings[aula|data].waitlist). Quem sai libera a vaga
            e o primeiro da fila entra automaticamente, com aviso.
   ===================================================================== */

async function saveSessionExceptions(){ scheduleSave('sessionExceptions', ()=>state.sessionExceptions); }
async function saveClassTypes(){ scheduleSave('classTypes', ()=>state.classTypes); }
async function saveSessionBookings(){ scheduleSave('sessionBookings', ()=>state.sessionBookings); }
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0); }
function rand01(seed){ return (hashStr(seed) % 10000) / 10000; }
function timeToMin(t){ const [h,m] = String(t||'0:0').split(':').map(Number); return h*60+(m||0); }
function minToTime(n){ n = Math.max(0, Math.min(23*60+59, n)); return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'); }
const DAY_SHORT = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DAY_PICK_ORDER = [6,0,1,2,3,4,5];           // D S T Q Q S S, como no Tecnofit
const DAY_LETTER = ['S','T','Q','Q','S','S','D']; // letra por índice de DAYS
const TYPE_COLORS = ['#1E5FA8','#F2C94C','#F2994A','#EB5757','#E0457B','#9B51E0','#5B4FD8','#2F80ED','#18A0C9','#27AE60','#8BC34A','#B7A33A','#8D5B3E','#7A8794','#2D3A45'];
const TYPE_ICONS = ['🏐','⚽','🎾','🏓','🏋️','🤸','🏃','🧘','🥇','🏖️'];
// Feriados nacionais (no sistema real: tabela por CT, com feriados municipais)
const HOLIDAYS = {'2026-09-07':'Independência','2026-10-12':'Nossa Senhora Aparecida','2026-11-02':'Finados','2026-11-15':'Proclamação da República',
  '2026-11-20':'Consciência Negra','2026-12-25':'Natal','2027-01-01':'Confraternização Universal','2027-02-08':'Carnaval','2027-02-09':'Carnaval'};

/* ---------------- helpers de turma/aula ---------------- */
function instructorsOf(cl){ return (cl.instructors && cl.instructors.length) ? cl.instructors : (cl.instructor ? [cl.instructor] : []); }
function typeOf(cl){ return (state.classTypes||[]).find(t=> t.id===cl.typeId) || null; }
function clColor(cl){ const t = typeOf(cl); return t ? t.color : '#1E5FA8'; }
function clIcon(cl){ const t = typeOf(cl); return t ? t.icon : ''; }
function excKey(classId, date){ return `${classId}|${date}`; }
function getException(classId, date){ return (state.sessionExceptions||{})[excKey(classId,date)] || null; }
function occursOn(cl, date){
  if(cl.active===false || cl.day!==weekdayName(date)) return false;
  if(cl.kind==='Única') return cl.date===date;
  return !cl.validFrom || cl.validFrom <= date;
}
function cancelInfo(cl, date){
  const e = getException(cl.id, date); if(e) return e;
  if(cl.considerHolidays && HOLIDAYS[date]) return {status:'Feriado', reason:'Feriado: '+HOLIDAYS[date]};
  if(cl.considerHolidays && state.settings && (state.settings.customHolidays||[]).some(h=> h.d===date)) return {status:'Feriado', reason:'Feriado: '+state.settings.customHolidays.find(h=> h.d===date).n};
  return null;
}
function bookingOf(cl, date){
  const k = excKey(cl.id, date);
  const b = state.sessionBookings[k] = state.sessionBookings[k] || {accepted:[], waitlist:[]};
  if(b.extra){ b.accepted = [...(b.accepted||[]), ...b.extra.map(id=>({contactId:id, at:nowISO()}))]; delete b.extra; }
  b.accepted = b.accepted || []; b.waitlist = b.waitlist || [];
  return b;
}

function peekBooking(cl, date){
  const b = (state.sessionBookings||{})[excKey(cl.id,date)];
  if(!b) return {accepted:[], waitlist:[]};
  return {accepted: [...(b.accepted||[]), ...((b.extra||[]).map(id=>({contactId:id, at:''})))], waitlist: b.waitlist||[]};
}

// Ocupação da aula numa data = quem ACEITOU, na ordem do aceite. Passou do limite de vagas, vai para a fila.
function sessionRoster(cl, date){
  const b = peekBooking(cl, date);
  const fixed = cl.studentIds||[];
  const accIds = b.accepted.map(a=> a.contactId);
  const waitIds = b.waitlist.map(w=> w.contactId);
  const declined = fixed.filter(id=> getConf(cl.id, date, id)==='Não vou' && !accIds.includes(id) && !waitIds.includes(id));
  const pending = fixed.filter(id=> !accIds.includes(id) && !waitIds.includes(id) && !declined.includes(id));
  return {fixed, accepted:b.accepted, accIds, waitlist:b.waitlist, waitIds, declined, pending,
    extra: accIds.filter(id=> !fixed.includes(id)), occ: accIds.length, cap: cl.capacity||0};
}

function contactName(id){ const c = state.contacts.find(x=>x.id===id); return c ? c.name : '—'; }

/* ---- matrícula fixa com fila ---- */
function enrollFixed(cl, contactId, opts={}){
  if((cl.studentIds||[]).includes(contactId)) return 'already';
  const c = state.contacts.find(x=>x.id===contactId);
  if((cl.studentIds||[]).length >= (cl.capacity||0)){
    if(!clCfg(cl).waitlistFixed) return 'full';
    cl.waitlist = cl.waitlist || [];
    if(!cl.waitlist.some(w=> w.contactId===contactId)) cl.waitlist.push({contactId, at:nowISO(), fromClassId: opts.fromClassId||null});
    if(opts.notify!==false) notifyContact(contactId, `A turma ${classLabel(cl)} está lotada. Você entrou na fila de espera (posição ${cl.waitlist.findIndex(w=>w.contactId===contactId)+1}).`);
    audit('Entrou na fila da turma', `${c?c.name:''} · ${classLabel(cl)}`);
    return 'waitlist';
  }
  cl.studentIds = [...(cl.studentIds||[]), contactId];
  if(c) c.enrolledClassIds = [...new Set([...(c.enrolledClassIds||[]), cl.id])];
  return 'enrolled';
}
function unenrollFixed(cl, contactId, reason){
  if(!(cl.studentIds||[]).includes(contactId)) return;
  cl.studentIds = cl.studentIds.filter(id=> id!==contactId);
  const c = state.contacts.find(x=>x.id===contactId);
  if(c) c.enrolledClassIds = (c.enrolledClassIds||[]).filter(id=> id!==cl.id);
  audit('Saiu da turma', `${c?c.name:''} · ${classLabel(cl)}${reason?' · '+reason:''}`);
  promoteFixed(cl);
}
function promoteFixed(cl){
  let promoted = [];
  while((cl.waitlist||[]).length && (cl.studentIds||[]).length < (cl.capacity||0)){
    const w = cl.waitlist.shift();
    cl.studentIds = [...(cl.studentIds||[]), w.contactId];
    const c = state.contacts.find(x=>x.id===w.contactId);
    if(c) c.enrolledClassIds = [...new Set([...(c.enrolledClassIds||[]), cl.id])];
    notifyContact(w.contactId, `Abriu vaga! Você saiu da fila e agora está matriculado em ${classLabel(cl)}.`);
    audit('Fila da turma: vaga preenchida', `${c?c.name:''} entrou em ${classLabel(cl)}`);
    promoted.push(c ? c.name : '');
    if(w.fromClassId){ const from = state.classes.find(x=>x.id===w.fromClassId); if(from) unenrollFixed(from, w.contactId, 'troca de horário concluída'); }
  }
  return promoted;
}
function leaveFixedWaitlist(cl, contactId){ cl.waitlist = (cl.waitlist||[]).filter(w=> w.contactId!==contactId); }

/* ---- aula do dia (avulsa / reposição) com fila ---- */
function acceptSession(cl, date, contactId, kind){
  const b = bookingOf(cl, date);
  kind = kind || kindFor(cl, contactId);
  if(b.accepted.some(a=> a.contactId===contactId)) return 'already';
  if(b.waitlist.some(w=> w.contactId===contactId)) return 'waitlist';
  if(b.accepted.length < (cl.capacity||0)){
    b.accepted.push({contactId, at:nowISO(), kind});
    setConf(cl.id, date, contactId, 'Vou');
    return 'accepted';
  }
  if(!clCfg(cl).waitlistDay) return 'full';
  b.waitlist.push({contactId, at:nowISO(), kind});
  setConf(cl.id, date, contactId, 'Fila');
  audit('Entrou na fila da aula', `${contactName(contactId)} · ${classLabel(cl)} ${fmtDateBR(date)} · ${b.waitlist.length}º`);
  return 'waitlist';
}
function bookSession(cl, date, contactId){ return acceptSession(cl, date, contactId); }

// Aluno desiste ou professor remove: sai da lista/fila e o 1º da fila entra no lugar
function declineSession(cl, date, contactId, by){
  const b = bookingOf(cl, date);
  const wasIn = b.accepted.some(a=> a.contactId===contactId);
  const prev = b.accepted.find(a=> a.contactId===contactId) || b.waitlist.find(w=> w.contactId===contactId);
  if(prev){ b.removed = b.removed || []; b.removed.push({contactId, kind: prev.kind||kindFor(cl, contactId), at:nowISO(), by: by || 'o próprio aluno', from: wasIn ? 'lista' : 'fila'}); }
  b.accepted = b.accepted.filter(a=> a.contactId!==contactId);
  b.waitlist = b.waitlist.filter(w=> w.contactId!==contactId);
  setConf(cl.id, date, contactId, (cl.studentIds||[]).includes(contactId) ? 'Não vou' : null);
  if(by) notifyContact(contactId, `Você foi retirado da aula de ${fmtDateBR(date)} ${cl.startTime} (${cl.name}) por ${by}.`);
  return wasIn ? promoteSession(cl, date) : [];
}
function leaveSession(cl, date, contactId){ return declineSession(cl, date, contactId); }

function promoteSession(cl, date){
  const b = bookingOf(cl, date); const promoted = [];
  while(b.waitlist.length && b.accepted.length < (cl.capacity||0)){
    const w = b.waitlist.shift();
    b.accepted.push({contactId:w.contactId, at:nowISO(), fromWaitlist:true, kind:w.kind||kindFor(cl, w.contactId)});
    setConf(cl.id, date, w.contactId, 'Vou');
    notifyContact(w.contactId, `Abriu vaga na aula de ${fmtDateBR(date)} ${cl.startTime} (${cl.name}). Você saiu da fila e está confirmado.`);
    audit('Fila da aula: vaga preenchida', `${contactName(w.contactId)} · ${classLabel(cl)} ${fmtDateBR(date)}`);
    promoted.push(contactName(w.contactId));
  }
  return promoted;
}
// bloco "Fila de espera" mostrado abaixo da lista principal, separado por uma divisória
function waitlistEntries(cl, date){
  const out = [];
  if(date) sessionRoster(cl, date).waitlist.forEach(w=> out.push({id:w.contactId, kind:'dia'}));
  (cl.waitlist||[]).forEach(w=>{ if(!out.some(o=> o.id===w.contactId)) out.push({id:w.contactId, kind:'fixa', troca: !!w.fromClassId}); });
  return out;
}
function waitlistBlock(cl, date){
  const list = waitlistEntries(cl, date);
  if(!list.length) return '';
  return `<div class="wl-sep"><span>Fila de espera · ${list.length}</span></div>
    <div class="wl-list">${list.map((w,i)=>`<div class="wl-row"><span class="wl-pos">${i+1}º</span><span class="wl-name">${esc(contactName(w.id))}</span><span class="wl-tag ${w.kind}" title="${w.kind==='dia'?'Fila desta aula (ordem de aceite)':(w.troca?'Fila de vaga fixa por troca de horário':'Fila de vaga fixa (matrícula semanal)')}">${w.kind==='dia'?'aula':(w.troca?'troca':'fixa')}</span></div>`).join('')}</div>`;
}
// lista da chamada: quem aceitou a aula; datas antigas sem aceite usam os matriculados
function attendanceRosterIds(cl, date){
  const r = sessionRoster(cl, date);
  return r.accIds.length ? r.accIds : (cl.studentIds||[]);
}
// matrícula fixa nunca passa do limite: o excedente vai para a fila da turma
function enforceCapacity(cl){
  const cap = cl.capacity||0; const ids = cl.studentIds||[];
  if(!cap || ids.length <= cap) return [];
  const over = ids.slice(cap);
  cl.studentIds = ids.slice(0, cap);
  cl.waitlist = cl.waitlist || [];
  over.forEach(id=>{
    if(!cl.waitlist.some(w=> w.contactId===id)) cl.waitlist.push({contactId:id, at:nowISO()});
    const c = state.contacts.find(x=>x.id===id); if(c) c.enrolledClassIds = (c.enrolledClassIds||[]).filter(x=> x!==cl.id);
  });
  return over;
}

function setConf(classId, date, contactId, val){
  const k = confKey(classId, date, contactId);
  if(val) PLATFORM.confirmations[k] = val; else delete PLATFORM.confirmations[k];
}

/* ---------------- migração: classes antigas → turma + aula ---------------- */
function ensureSeriesIds(){
  let changed = false;
  state.classTypes = state.classTypes || [];
  const unitShort = id=>{ const u = state.units.find(x=>x.id===id); return u ? (u.city||u.name).replace(/^.*?-\s*/,'').split(/[ ,]/)[0] : ''; };
  const names = {};
  state.classes.forEach(cl=>{ (names[cl.name] = names[cl.name] || new Set()).add(cl.unitId); });
  state.classes.forEach(cl=>{
    if(!cl.seriesId){ cl.seriesId = 's_' + hashStr([cl.unitId, cl.name, cl.startTime, cl.endTime, cl.instructor, cl.modality].join('|')).toString(36); changed = true; }
    if(cl.active===undefined){ cl.active = true; changed = true; }
    if(!cl.instructors){ cl.instructors = cl.instructor ? [cl.instructor] : []; changed = true; }
    if(!cl.kind){ cl.kind = 'Recorrente'; changed = true; }
    if(cl.considerHolidays===undefined){ cl.considerHolidays = true; changed = true; }
    if(!cl.waitlist){ cl.waitlist = []; changed = true; }
    if(enforceCapacity(cl).length) changed = true;
    if(!cl.typeId){
      const tname = names[cl.name].size>1 ? `${cl.name} - ${unitShort(cl.unitId)}` : cl.name;
      let t = state.classTypes.find(x=> x.name===tname);
      if(!t){
        t = {id:'ty_'+uid(), name:tname, capacity:cl.capacity||8, durationMin: Math.max(30, timeToMin(cl.endTime)-timeToMin(cl.startTime)) || 60,
          note:'', color: TYPE_COLORS[state.classTypes.length % TYPE_COLORS.length], icon: TYPE_ICONS[0], modality: cl.modality, level: normalizeLevel(cl.level)};
        state.classTypes.push(t);
      }
      cl.typeId = t.id; cl.name = t.name; changed = true;
    }
  });
  if(changed){ saveClasses(); saveClassTypes(); }
}
function seriesList(){
  const map = {};
  state.classes.forEach(cl=>{ (map[cl.seriesId] = map[cl.seriesId] || []).push(cl); });
  return Object.entries(map).map(([id, items])=>{
    const f = items[0];
    return {id, items, typeId:f.typeId, name:f.name, modality:f.modality, unitId:f.unitId, instructors:instructorsOf(f), instructor:instructorsOf(f).join(', '),
      startTime:f.startTime, endTime:f.endTime, capacity:f.capacity, minStudents:f.minStudents ?? 4, level:f.level, personalized:f.personalized,
      active:f.active!==false, validFrom:f.validFrom||'', kind:f.kind||'Recorrente', date:f.date||'', considerHolidays:f.considerHolidays!==false, notes:f.notes||'',
      days: DAYS.filter(d=> items.some(i=> i.day===d)),
      students: items.reduce((s,i)=> s+(i.studentIds||[]).length, 0),
      waiting: items.reduce((s,i)=> s+(i.waitlist||[]).length, 0)};
  }).sort((a,b)=> (a.unitId+a.startTime+a.name).localeCompare(b.unitId+b.startTime+b.name));
}

/* ---------------- sessões (substituem as versões simples) ---------------- */
function upcomingSessions(classes, days){
  const out = []; const now = new Date(); const today = todayISO();
  for(let d=0; d<days; d++){
    const date = addDaysISO(today, d);
    classes.filter(cl=> occursOn(cl, date)).forEach(cl=>{
      if(sessionStart(date, cl.endTime || cl.startTime) < now) return;
      out.push({cl, date, start: sessionStart(date, cl.startTime), exc: cancelInfo(cl, date)});
    });
  }
  return out.sort((a,b)=> a.start-b.start);
}
function pastSessions(classes, fromISO, toISO){
  const out = []; const now = new Date();
  for(let date = fromISO; date <= toISO; date = addDaysISO(date, 1)){
    classes.forEach(cl=>{
      if(!occursOn(cl, date)) return;
      if(sessionStart(date, cl.endTime||cl.startTime) > now) return;
      if(cancelInfo(cl, date)) return;
      if(!(cl.studentIds||[]).length) return;
      out.push({cl, date, rec: state.attendanceRecords[`${cl.id}|${date}`] || null});
    });
  }
  return out;
}

/* ---------------- histórico de presença para a demo ---------------- */
async function seedAttendanceHistoryIfNeeded(){
  const flag = await storageGet('demoAttendance');
  if(flag) return;
  const today = todayISO();
  state.classes.forEach((cl, ci)=>{
    if(!(cl.studentIds||[]).length) return;
    for(let d=1; d<=56; d++){
      const date = addDaysISO(today, -d);
      if(weekdayName(date)!==cl.day) continue;
      if(d<=7 && ci%3===0) continue;
      const rec = {};
      cl.studentIds.forEach(sid=>{
        const base = rand01(sid+'base');
        const p = base < 0.18 ? 0.35 : 0.68 + base*0.3;
        const trend = base < 0.18 && d < 21 ? -0.25 : 0;
        rec[sid] = rand01(sid+date+cl.id) < (p+trend) ? 'Presente' : 'Falta';
      });
      state.attendanceRecords[`${cl.id}|${date}`] = rec;
    }
  });
  await saveAttendance();
  await storageSet('demoAttendance','1');
}
async function seedAcceptancesIfNeeded(){
  const flag = await storageGet('demoAccept');
  if(flag) return;
  state.sessionBookings = {};
  const today = todayISO();
  state.classes.forEach(cl=>{
    if(!(cl.studentIds||[]).length) return;
    upcomingSessions([cl], 8).filter(x=> !x.exc).forEach(x=>{
      cl.studentIds.forEach((id,i)=>{
        if(id==='c_demo_aluno') return;
        const r = rand01(id+x.date+cl.id);
        if(r < 0.65) acceptSession(cl, x.date, id); else if(r < 0.8) setConf(cl.id, x.date, id, 'Não vou');
      });
    });
  });
  if(CURRENT_TENANT==='t_rapha'){
    const cl = state.classes.find(c=> c.name.startsWith('Treino Manhã 07h') && c.day==='Quarta');
    const next = cl && upcomingSessions([cl], 8).find(x=> !x.exc);
    if(next){
      const b = bookingOf(cl, next.date); b.accepted = []; b.waitlist = [];
      // aluno demo aceitou cedo; a aula lota e 2 pessoas ficam na fila
      acceptSession(cl, next.date, 'c_demo_aluno');
      const others = state.contacts.filter(c=> c.status==='Ativo' && c.id!=='c_demo_aluno');
      const order = [...(cl.studentIds||[]).filter(id=> id!=='c_demo_aluno'), ...others.map(c=>c.id).filter(id=> !(cl.studentIds||[]).includes(id))];
      order.slice(0, (cl.capacity||8) + 1).forEach(id=> acceptSession(cl, next.date, id));
    }
  }
  savePlatform(); await saveSessionBookings();
  await storageSet('demoAccept','1');
}
async function seedWaitlistDemoIfNeeded(){
  const flag = await storageGet('demoWaitlist');
  if(flag || CURRENT_TENANT!=='t_rapha') return;
  // deixa uma aula lotada com fila para a demo
  const cl = state.classes.find(c=> c.name.startsWith('Treino Manhã 07h') && c.day==='Quarta');
  if(cl){
    const others = state.contacts.filter(c=> c.status==='Ativo' && !(cl.studentIds||[]).includes(c.id) && c.id!=='c_demo_aluno');
    let i = 0;
    while((cl.studentIds||[]).length < (cl.capacity||8) && others[i]){ enrollFixed(cl, others[i].id, {notify:false}); i++; }
    for(let k=0; k<2 && others[i]; k++, i++) enrollFixed(cl, others[i].id, {notify:false});
    await saveClasses(); await saveContacts(); await saveSessionBookings();
  }
  await storageSet('demoWaitlist','1');
}

/* ---------------- Tela: Grade de aulas ---------------- */
function schedFilteredClasses(){
  const allowed = allowedUnitIds();
  const unitF = state.schedUnit || 'all', instrF = state.schedInstr || 'all';
  return state.classes.filter(cl=> (!allowed || allowed.has(cl.unitId)) && (unitF==='all' || cl.unitId===unitF) && (instrF==='all' || instructorsOf(cl).includes(instrF)));

function renderSchedule(){
  const view = state.schedView || 'week';

function renderScheduleWeek(){
  const ws = state.schedWeek || weekStart(todayISO());
  const dates = DAYS.map((_,i)=> addDaysISO(ws, i));
  const classes = schedFilteredClasses();
  const today = todayISO();
  const occ = dates.map(date=> classes.filter(cl=> occursOn(cl, date)));
  const times = [...new Set(occ.flat().map(cl=> cl.startTime))].sort();
  const end = new Date(dates[6]+'T00:00:00');
  const label = `${new Date(dates[0]+'T00:00:00').getDate()} - ${end.getDate()} de ${end.toLocaleDateString('pt-BR',{month:'long'})} de ${end.getFullYear()}`;
  return `
  <div class="wk-nav">
    <button class="icon-btn" data-act="week-nav" data-d="-7">‹</button>
    <span class="wk-label">${esc(label)}</span>
    <button class="icon-btn" data-act="week-nav" data-d="7">›</button>
