function renderScheduleList(){
  const editable = can('agenda.update');
  const allowed = allowedUnitIds();
  const list = seriesList().filter(s=> s.items.some(i=> schedFilteredClasses().includes(i)));
  const activeClasses = state.classes.filter(cl=> cl.active!==false && (!allowed || allowed.has(cl.unitId)));
  const weekly = activeClasses.filter(c=> c.kind!=='Única').length;
  const hours = activeClasses.reduce((s,cl)=> s + Math.max(0, timeToMin(cl.endTime)-timeToMin(cl.startTime))/60, 0);
  const cap = activeClasses.reduce((s,cl)=> s + (cl.capacity||0), 0);
  const enrolled = activeClasses.reduce((s,cl)=> s + (cl.studentIds||[]).length, 0);
  const waiting = activeClasses.reduce((s,cl)=> s + (cl.waitlist||[]).length, 0);
  const byInstr = [...new Set(activeClasses.flatMap(c=>instructorsOf(c)))].sort().map(name=>{
    const cls = activeClasses.filter(c=> instructorsOf(c).includes(name));
    return {name, n: cls.length, h: cls.reduce((s,cl)=> s + Math.max(0, timeToMin(cl.endTime)-timeToMin(cl.startTime))/60, 0), st: new Set(cls.flatMap(c=>c.studentIds||[])).size};
  });
  const upcomingExc = Object.entries(state.sessionExceptions||{}).filter(([k])=> k.split('|')[1] >= todayISO())
    .map(([k,v])=>({k, ...v, cl: state.classes.find(c=> c.id===k.split('|')[0]), date:k.split('|')[1]}))
    .filter(e=> e.cl && (!allowed || allowed.has(e.cl.unitId))).sort((a,b)=> a.date.localeCompare(b.date));
  const excGroups = {};
  upcomingExc.forEach(e=>{ const g = `${e.date}|${e.reason}`; (excGroups[g] = excGroups[g] || []).push(e); });
  return `
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Aulas recorrentes / semana</div><div class="value">${weekly}</div><div class="plan-billing">${hours.toFixed(1).replace('.',',')} h de quadra</div></div>
    <div class="stat-card"><div class="label">Vagas fixas</div><div class="value">${cap}</div><div class="plan-billing">${enrolled} ocupadas · ${cap?Math.round(enrolled/cap*100):0}%</div></div>
    <div class="stat-card" style="border-left:4px solid ${waiting?'var(--sand)':'var(--line)'};"><div class="label">Alunos na fila de espera</div><div class="value">${waiting}</div><div class="plan-billing">entram sozinhos quando abre vaga</div></div>
    <div class="stat-card"><div class="label">Cancelamentos futuros</div><div class="value">${upcomingExc.length}</div><div class="plan-billing">+ feriados automáticos</div></div>
  </div>
  <div class="table-wrap" style="margin-bottom:20px;"><table class="sched-table">
    <thead><tr><th>Turma</th><th>Dias</th><th>Horário</th><th>Professores</th><th>Unidade</th><th>Ocupação</th><th>Status</th><th></th></tr></thead>
    <tbody>
    ${list.length ? list.map(s=>{
      const slots = (s.capacity||0) * s.items.length; const pct = slots ? Math.round(s.students/slots*100) : 0;
      const t = state.classTypes.find(x=>x.id===s.typeId);
      return `<tr class="${s.active?'':'sched-paused'}">
        <td><span class="type-dot" style="background:${esc(t?t.color:'#999')}"></span><b>${esc(s.name)}</b><div class="st-meta">${esc(s.kind)}${s.kind==='Única'?' · '+fmtDateBR(s.date):''}${s.considerHolidays?'':' · ignora feriados'}</div></td>
        <td>${s.kind==='Única' ? `<span class="st-meta">${fmtDateBR(s.date)}</span>` : `<div class="day-chips">${DAYS.map((d,i)=>`<span class="day-chip ${s.days.includes(d)?'on':''}">${DAY_SHORT[i]}</span>`).join('')}</div>`}</td>
        <td style="white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-size:12.5px;">${esc(s.startTime)}–${esc(s.endTime)}</td>
        <td>${esc(s.instructor||'—')}</td>
        <td>${esc(unitName(s.unitId).replace(/^.*?-\s*/,''))}</td>
        <td style="min-width:140px;"><div class="occ-bar"><div style="width:${Math.min(100,pct)}%"></div></div><div class="st-meta">${s.students}/${slots} · ${pct}%${s.waiting?` · <b style="color:#a8672a;">fila ${s.waiting}</b>`:''}</div></td>
        <td><span class="pill ${s.active?'st-Ativo':'st-Perdido'}">${s.active?'Ativa':'Pausada'}</span>${s.validFrom && s.validFrom>todayISO()?`<div class="st-meta">a partir de ${fmtDateBR(s.validFrom)}</div>`:''}</td>
        <td><div class="row-actions">
          ${editable?`<button class="icon-btn" title="Editar" data-act="edit-series" data-id="${s.id}">${iconEdit()}</button><button class="btn btn-ghost btn-sm" data-act="toggle-series" data-id="${s.id}">${s.active?'Pausar':'Reativar'}</button>`:''}
          ${can('agenda.delete')?`<button class="icon-btn" title="Excluir" data-act="del-series" data-id="${s.id}">${iconTrash()}</button>`:''}
        </div></td></tr>`; }).join('') : `<tr><td colspan="8"><div class="empty">Nenhuma aula com esses filtros.</div></td></tr>`}
    </tbody></table></div>
  <div class="panel-grid">
    <div class="panel">
      <h3>Cancelar aulas de uma data</h3>
      ${editable ? `
      <div class="field-row">
        <div class="field"><label>Data</label><input type="date" id="ex_date" value="${addDaysISO(todayISO(),1)}"></div>
        <div class="field"><label>Unidade</label><select id="ex_unit">${allowed?'':'<option value="all">Todas as unidades</option>'}${state.units.filter(u=>!allowed||allowed.has(u.id)).map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Motivo</label><input id="ex_reason" placeholder="Ex.: chuva forte, evento no CT, feriado municipal"></div>
      <button class="btn btn-primary" data-act="add-exception">Cancelar e avisar alunos</button>
      <p class="st-hint" style="margin-top:8px;">Feriados nacionais já são pulados nas aulas com “Considerar feriados”. Para cancelar só uma aula, clique nela na agenda da semana.</p>` : '<p class="st-hint">Sem permissão para alterar a grade.</p>'}
      ${Object.keys(excGroups).length ? `<div style="margin-top:14px;">${Object.entries(excGroups).map(([g, items])=>`
        <div class="exc-row"><div><b>${fmtDateBR(items[0].date)}</b> · ${esc(items[0].reason)}<div class="st-meta">${items.length} aula(s): ${esc(items.slice(0,3).map(e=> e.cl.startTime+' '+e.cl.name).join(', '))}${items.length>3?'…':''}</div></div>
        ${editable?`<button class="btn btn-ghost btn-sm" data-act="undo-exception" data-keys="${esc(items.map(e=>e.k).join(','))}">Desfazer</button>`:''}</div>`).join('')}</div>` : ''}
    </div>
    <div class="panel">
      <h3>Carga semanal por professor</h3>
      <table class="mini-table"><thead><tr><th>Professor</th><th>Aulas</th><th>Horas</th><th>Alunos</th></tr></thead>
      <tbody>${byInstr.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.n}</td><td>${x.h.toFixed(1).replace('.',',')}</td><td>${x.st}</td></tr>`).join('') || '<tr><td colspan="4" class="st-meta">—</td></tr>'}</tbody></table>
      <p class="st-hint" style="margin-top:10px;">Aula com 2 professores conta para os dois. Base para a comissão (regra a definir).</p>
    </div>
  </div>`;
}

function readAulaDraft(){
  const d = state.aulaDraft; if(!d) return;
  const g = id=> document.getElementById(id);
  if(g('au_type')) d.typeId = g('au_type').value;
  if(g('au_cap')) d.capacity = Number(g('au_cap').value)||d.capacity;
  if(g('au_kind')) d.kind = g('au_kind').value;
  if(g('au_from')) d.validFrom = g('au_from').value;
  if(g('au_unit')) d.unitId = g('au_unit').value;
  if(g('au_hol')) d.considerHolidays = g('au_hol').checked;
  if(g('au_notes')) d.notes = g('au_notes').value;
  if(g('au_day_0')) d.days = DAYS.filter((_,i)=> g('au_day_'+i) && g('au_day_'+i).checked);
  d.times = d.times.map((t,i)=> g('au_time_'+i) ? g('au_time_'+i).value : t);
}
function openAulaModal(seriesId, typeId){
  const s = seriesId ? seriesList().find(x=>x.id===seriesId) : null;
  const allowed = allowedUnitIds();
  const t = state.classTypes.find(x=> x.id===(typeId || (s&&s.typeId))) || state.classTypes[0];
  state.aulaDraft = s ? {typeId:s.typeId, capacity:s.capacity, kind:s.kind, validFrom:s.kind==='Única'?s.date:(s.validFrom||todayISO()), unitId:s.unitId, days:[...s.days],
      times:[s.startTime], considerHolidays:s.considerHolidays, instructors:[...s.instructors], notes:s.notes}

/* ---------------- Frequência no dashboard ---------------- */
function rateOf(sessions){
  let p=0, f=0;
  sessions.forEach(s=>{ if(!s.rec) return; Object.values(s.rec).forEach(v=>{ if(v==='Presente') p++; else if(v==='Falta') f++; }); });
  return {p, f, rate: (p+f) ? p/(p+f) : null};
}
function pctTxt(r){ return r==null ? '—' : Math.round(r*100)+'%'; }
function weekStart(iso){ const d = new Date(iso+'T00:00:00'); const idx = (d.getDay()+6)%7; return addDaysISO(iso, -idx); }

function renderFrequencyDashboard(){
  const classes = filteredClasses();
  if(!classes.length) return '';
  const today = todayISO();
  const s30 = pastSessions(classes, addDaysISO(today,-30), today);
  const sPrev = pastSessions(classes, addDaysISO(today,-60), addDaysISO(today,-31));
  const r30 = rateOf(s30), rPrev = rateOf(sPrev);
  const delta = (r30.rate!=null && rPrev.rate!=null) ? Math.round((r30.rate - rPrev.rate)*100) : null;
  const done = s30.filter(s=> s.rec && Object.keys(s.rec).length);
  const pending = pastSessions(classes, addDaysISO(today,-14), today).filter(s=> !s.rec || !Object.keys(s.rec).length);
  const active = classes.filter(c=> c.active!==false);
  const cap = active.reduce((s,c)=> s+(c.capacity||0), 0), enr = active.reduce((s,c)=> s+(c.studentIds||[]).length, 0);
  const waiting = active.reduce((s,c)=> s+(c.waitlist||[]).length, 0);
  const fullCount = active.filter(c=> (c.studentIds||[]).length >= (c.capacity||0)).length;
  const thisWeek = weekStart(today);
  const weeks = Array.from({length:8}, (_,i)=> addDaysISO(thisWeek, -7*(7-i)));
  const s56 = pastSessions(classes, weeks[0], today);
  const weekRates = weeks.map(w=>{ const r = rateOf(s56.filter(s=> weekStart(s.date)===w)); return {w, ...r}; });
  const perStudent = {};
  s30.slice().sort((a,b)=> a.date.localeCompare(b.date)).forEach(s=>{
    if(!s.rec) return;
    Object.entries(s.rec).forEach(([sid,v])=>{
      const o = perStudent[sid] = perStudent[sid] || {p:0,f:0,streak:0,last:null};
      if(v==='Presente'){ o.p++; o.streak=0; o.last=s.date; } else { o.f++; o.streak++; }
    });
  });
  const risk = Object.entries(perStudent).map(([sid,o])=>({c: state.contacts.find(x=>x.id===sid), ...o, rate:o.p/(o.p+o.f)}))
    .filter(x=> x.c && x.c.status==='Ativo' && (x.p+x.f)>=3 && (x.rate<0.6 || x.streak>=3))
    .sort((a,b)=> b.streak-a.streak || a.rate-b.rate).slice(0, 8);
  const instrs = [...new Set(classes.flatMap(c=>instructorsOf(c)))];
  const byInstr = instrs.map(n=>{ const ss = s30.filter(s=> instructorsOf(s.cl).includes(n)); return {n, r: rateOf(ss).rate, given: ss.filter(s=>s.rec).length, pend: pending.filter(s=> instructorsOf(s.cl).includes(n)).length}; }).sort((a,b)=> (b.r||0)-(a.r||0));
  const bySeries = seriesList().filter(sr=> sr.items.some(i=> classes.includes(i))).map(sr=>{
    const ss = s30.filter(s=> sr.items.includes(s.cl)); const slots = (sr.capacity||0)*sr.items.length;
    return {sr, r: rateOf(ss).rate, occ: slots ? sr.students/slots : 0};
  }).filter(x=> x.r!=null).sort((a,b)=> a.r-b.r);
  const times = [...new Set(classes.map(c=>c.startTime))].sort();
  const cell = (d,t)=> rateOf(s56.filter(s=> s.cl.day===d && s.cl.startTime===t));
  const heat = r=> r==null ? 'var(--line)' : `rgba(30,95,168,${(0.12 + 0.88*Math.max(0,(r-0.4)/0.6)).toFixed(2)})`;
  const W = 520, H = 170, padL = 34, padB = 26, bw = (W-padL-10)/weekRates.length;
  const bars = weekRates.map((w,i)=>{
    const r = w.rate; const h = r==null ? 0 : (H-padB-14)*r;
    const x = padL + i*bw + 6, y = H-padB-h;
    const lbl = new Date(w.w+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
    return `<g><title>Semana de ${lbl}: ${pctTxt(r)} (${w.p} presenças, ${w.f} faltas)</title>
      <rect x="${x}" y="${y}" width="${bw-12}" height="${Math.max(h,0)}" rx="4" fill="${i===weekRates.length-1?'var(--cyan)':'var(--blue)'}"/>
      ${r!=null && (i===weekRates.length-1 || i===0) ? `<text x="${x+(bw-12)/2}" y="${y-4}" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="700">${pctTxt(r)}</text>` : ''}
      <text x="${x+(bw-12)/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-soft)">${lbl}</text></g>`;
  }).join('');
  const grid = [0.5, 1].map(v=>{ const y = H-padB-(H-padB-14)*v; return `<line x1="${padL}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${padL-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--ink-soft)">${v*100}%</text>`; }).join('');
  return `
  <h3 class="dash-section">Frequência e ocupação${state.unitFilter!=='all'?' · '+esc(unitName(state.unitFilter)):''}${permScope('turmas')==='OWN'?' · suas turmas':''}</h3>
  <div class="stat-grid">
    <div class="stat-card"><div class="label">Presença (30 dias)</div><div class="value">${pctTxt(r30.rate)}</div><div class="plan-billing">${delta==null?'':(delta>=0?'▲ ':'▼ ')+Math.abs(delta)+' p.p. vs 30 dias anteriores'}</div></div>
    <div class="stat-card"><div class="label">Aulas dadas (30 dias)</div><div class="value">${done.length}</div><div class="plan-billing">${r30.p} presenças · ${r30.f} faltas</div></div>
    <div class="stat-card"><div class="label">Ocupação das vagas fixas</div><div class="value">${cap?Math.round(enr/cap*100):0}%</div><div class="plan-billing">${enr}/${cap} · ${fullCount} aula(s) lotada(s) · ${waiting} na fila</div></div>
    <div class="stat-card" style="border-left:4px solid ${pending.length?'var(--sand)':'var(--good)'};"><div class="label">Chamadas pendentes (14 dias)</div><div class="value">${pending.length}</div><div class="plan-billing">${pending.length?'professor ainda não registrou':'tudo em dia'}</div></div>
    <div class="stat-card" style="border-left:4px solid ${risk.length?'var(--danger)':'var(--good)'};"><div class="label">Alunos em risco de evasão</div><div class="value">${risk.length}</div><div class="plan-billing">presença &lt; 60% ou 3 faltas seguidas</div></div>
  </div>
  <div class="panel-grid" style="margin-bottom:20px;">
    <div class="panel"><h3>Presença por semana</h3>
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Taxa de presença nas últimas 8 semanas">${grid}${bars}</svg>
      <p class="st-hint">Presenças ÷ (presenças + faltas) nas chamadas registradas. Passe o mouse nas barras para ver os números.</p></div>
    <div class="panel"><h3>Presença por dia e horário</h3>
      <div class="heat" style="grid-template-columns:52px repeat(${DAYS.length}, 1fr);">
        <div></div>${DAY_SHORT.map(d=>`<div class="heat-h">${d}</div>`).join('')}
        ${times.map(t=>`<div class="heat-t">${esc(t)}</div>${DAYS.map(d=>{ const c = cell(d,t); const has = classes.some(cl=> cl.day===d && cl.startTime===t);
          return `<div class="heat-c" style="background:${has?heat(c.rate):'transparent'};color:${c.rate!=null && c.rate>0.7?'#fff':'var(--ink)'}" title="${d} ${t}: ${has?pctTxt(c.rate):'sem aula'}">${has?pctTxt(c.rate):''}</div>`; }).join('')}`).join('')}
      </div>
      <p class="st-hint" style="margin-top:8px;">Últimas 8 semanas. Mais escuro = mais presença; células vazias = sem aula.</p></div>
  </div>
  <div class="panel-grid" style="margin-bottom:24px;">
    <div class="panel"><h3>Alunos em risco de evasão</h3>
      ${risk.length ? risk.map(x=>`<div class="risk-row" ${can('contatos.update')?`data-edit-contact="${x.c.id}"`:''}>
        <div><b>${esc(x.c.name)}</b><div class="st-meta">última presença: ${x.last?fmtDateBR(x.last):'nenhuma em 30 dias'}</div></div>
        <div class="risk-r"><span class="pill req-Recusada">${Math.round(x.rate*100)}%</span>${x.streak>=2?`<span class="st-meta">${x.streak} faltas seguidas</span>`:''}</div></div>`).join('')
        : `<div class="empty" style="padding:16px;">Nenhum aluno em risco.</div>`}</div>
    <div class="panel"><h3>Por professor (30 dias)</h3>
      <table class="mini-table"><thead><tr><th>Professor</th><th>Presença</th><th>Aulas</th><th>Chamadas pendentes</th></tr></thead>
      <tbody>${byInstr.map(x=>`<tr><td>${esc(x.n)}</td><td><b>${pctTxt(x.r)}</b></td><td>${x.given}</td><td>${x.pend?`<span style="color:#a8672a;font-weight:700;">${x.pend}</span>`:'0'}</td></tr>`).join('')}</tbody></table>
      <h3 style="margin-top:18px;">Aulas com menor presença</h3>
      <table class="mini-table"><thead><tr><th>Aula</th><th>Presença</th><th>Ocupação</th></tr></thead>
      <tbody>${bySeries.slice(0,5).map(x=>`<tr><td>${esc(x.sr.name)} <span class="st-meta">${esc(x.sr.startTime)} · ${esc(x.sr.days.map(d=>DAY_SHORT[DAYS.indexOf(d)]).join('/'))}</span></td><td><b>${pctTxt(x.r)}</b></td><td>${Math.round(x.occ*100)}%</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}

/* ---------------- Aluno: agendar aula extra / reposição ---------------- */
/* ---------------- Faltas, justificativas e liberação de reposição ----------------
   Regra: faltou sem avisar = perde a reposição. Se justificar, a gestão pode gerar
   uma liberação (token REP-XXXX) com validade. Só com liberação o aluno remarca.  */
const MAKEUP_DAYS = [15, 30, 60];
function makeupCode(){ const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = 'REP-'; for(let i=0;i<4;i++) c += ch[Math.floor(Math.random()*ch.length)]; return c; }
async function saveMakeups(){ scheduleSave('makeups', ()=>state.makeups); }
function absencesOf(contactId, days){
  const from = addDaysISO(todayISO(), -(days||60));
  return Object.entries(state.attendanceRecords).filter(([k,rec])=> rec && rec[contactId]==='Falta' && k.split('|')[1] >= from)
    .map(([k])=>{ const [classId, date] = k.split('|'); return {classId, date, cl: state.classes.find(c=>c.id===classId)}; })
    .filter(a=> a.cl).sort((a,b)=> b.date.localeCompare(a.date));
}
function makeupFor(contactId, classId, date){ return (state.makeups||[]).find(m=> m.contactId===contactId && m.classId===classId && m.date===date && m.status!=='Cancelada'); }
function makeupStatus(m){
  if(m && m.status==='Liberada' && m.expiresAt < todayISO()) return 'Expirada';
  if(m && m.status==='Agendada' && m.use && m.use.date < todayISO()) return 'Usada';
  return m ? m.status : null;
}
function availableCredits(contactId){ return (state.makeups||[]).filter(m=> m.contactId===contactId && makeupStatus(m)==='Liberada').sort((a,b)=> a.expiresAt.localeCompare(b.expiresAt)); }
function visibleMakeups(){
  const allowed = allowedUnitIds();
  return (state.makeups||[]).filter(m=>{ if(!allowed) return true; const c = state.contacts.find(x=>x.id===m.contactId); return c && allowed.has(c.unitId); });
}
function grantMakeup(contactId, classId, date, days, note, by){
  let m = makeupFor(contactId, classId, date);
  if(!m){ m = {id:'mk_'+uid(), contactId, classId, date, createdAt:nowISO()}; state.makeups.push(m); }
  Object.assign(m, {status:'Liberada', code:makeupCode(), grantedBy: by || currentUser().name, grantedAt:nowISO(), expiresAt:addDaysISO(todayISO(), days), grantNote:note||''});
  const cl = state.classes.find(c=>c.id===classId);
  notifyContact(contactId, `Reposição liberada para a falta de ${fmtDateBR(date)} (${cl?cl.name:''}). Código ${m.code}, válido até ${fmtDateBR(m.expiresAt)}. Remarque na sua área.`);
  audit('Gerou liberação de reposição', `${contactName(contactId)} · falta ${fmtDateBR(date)} · ${m.code} · ${days} dias`);
  return m;
}
async function seedMakeupsIfNeeded(){
  const flag = await storageGet('demoMakeups');
  if(flag || CURRENT_TENANT!=='t_rapha') return;
  const today = todayISO();
  // aluno demo: duas faltas recentes, uma ainda sem justificativa e uma já liberada
  const mine = state.classes.filter(c=> (c.studentIds||[]).includes('c_demo_aluno'));
  const past = [];
  mine.forEach(cl=>{ for(let d=1; d<=21; d++){ const date = addDaysISO(today,-d); if(occursOn(cl,date) && !cancelInfo(cl,date)) past.push({cl,date}); } });
  past.sort((a,b)=> b.date.localeCompare(a.date));
  past.slice(0,2).forEach(x=>{ const k = `${x.cl.id}|${x.date}`; state.attendanceRecords[k] = {...(state.attendanceRecords[k]||{}), c_demo_aluno:'Falta'}; });
  if(past[1]) grantMakeup('c_demo_aluno', past[1].cl.id, past[1].date, 30, 'Atestado médico apresentado', 'Rapha');
  // outro aluno com justificativa aguardando análise
  const other = Object.entries(state.attendanceRecords).find(([k,rec])=> k.split('|')[1] >= addDaysISO(today,-14) && Object.entries(rec).some(([id,v])=> v==='Falta' && id!=='c_demo_aluno'));
  if(other){
    const [k, rec] = other; const [classId, date] = k.split('|');
    const contactId = Object.entries(rec).find(([id,v])=> v==='Falta' && id!=='c_demo_aluno')[0];
    state.makeups.push({id:'mk_'+uid(), contactId, classId, date, createdAt:nowISO(), status:'Aguardando análise',
      justification:'Tive um compromisso de trabalho de última hora e não consegui avisar a tempo.', justifiedAt:nowISO()});
  }
  await saveAttendance(); await saveMakeups();
  await storageSet('demoMakeups','1');
}

function renderStudentAbsences(c){
  const abs = absencesOf(c.id, 60);
  const credits = availableCredits(c.id);
  const badge = st=> ({'Aguardando análise':'req-Pendente','Liberada':'req-Aprovada','Agendada':'req-Aprovada','Usada':'st-Ativo','Recusada':'req-Recusada','Expirada':'req-Recusada'}[st]||'req-Recusada');
  return `
  <div class="panel st-panel">
    <div class="st-panel-head"><h3>Minhas faltas e reposições</h3>${credits.length?`<span class="pill req-Aprovada">${credits.length} reposição(ões) liberada(s)</span>`:''}</div>

function renderMakeupsAdmin(){
  const canGrant = can('reposicoes.approve');
  const allowed = allowedUnitIds();
  const today = todayISO();
  const list = visibleMakeups();
  const pending = list.filter(m=> m.status==='Aguardando análise').sort((a,b)=> (a.justifiedAt||'').localeCompare(b.justifiedAt||''));
  const issued = list.filter(m=> ['Liberada','Agendada','Usada','Expirada','Recusada'].includes(makeupStatus(m))).sort((a,b)=> (b.grantedAt||b.decidedAt||'').localeCompare(a.grantedAt||a.decidedAt||''));
  // faltas dos últimos 30 dias sem nenhum registro de reposição
  const contacts = state.contacts.filter(c=> !allowed || allowed.has(c.unitId));
  const loose = [];
  contacts.forEach(c=> absencesOf(c.id, 30).forEach(a=>{ if(!makeupFor(c.id, a.classId, a.date)) loose.push({...a, c}); }));
  loose.sort((a,b)=> b.date.localeCompare(a.date));
  const clOf = id=> state.classes.find(x=>x.id===id);
  const daysSel = id=> `<select id="${id}">${MAKEUP_DAYS.map(d=>`<option value="${d}" ${d===30?'selected':''}>${d} dias</option>`).join('')}</select>`;

  const used = list.filter(m=> ['Agendada','Usada'].includes(makeupStatus(m))).length;

    <thead><tr><th>Aluno</th><th>Aula que faltou</th><th>Justificativa</th><th></th></tr></thead>
    <tbody>${pending.length ? pending.map(m=>{ const cl = clOf(m.classId); return `<tr>
      <td><b>${esc(contactName(m.contactId))}</b><div class="st-meta">enviada ${m.justifiedAt?fmtDateTimeBR(m.justifiedAt):''}</div></td>
      <td>${esc(cl?cl.name:'—')}<div class="st-meta">${fmtDateBR(m.date)} · ${esc(cl?cl.startTime:'')}</div></td>
      <td style="max-width:320px;">${esc(m.justification||'')}</td>
      <td>${canGrant ? `<div class="req-actions">${daysSel('mkd_'+m.id)}<button class="btn btn-cyan btn-sm" data-act="mk-grant" data-id="${m.id}">Liberar reposição</button>
        <input type="text" id="mkr_${m.id}" placeholder="Motivo da recusa"><button class="btn btn-danger btn-sm" data-act="mk-deny" data-id="${m.id}">Recusar</button></div>` : ''}</td></tr>`; }).join('')
      : `<tr><td colspan="4"><div class="empty">Nenhuma justificativa aguardando.</div></td></tr>`}</tbody></table></div>

  <h3 class="dash-section">Faltas sem justificativa (30 dias) · perderam a reposição</h3>
  <div class="table-wrap" style="margin-bottom:20px;"><table>
    <thead><tr><th>Aluno</th><th>Aula</th><th>Data</th><th></th></tr></thead>
    <tbody>${loose.length ? loose.slice(0, 40).map(a=>`<tr>
      <td><b>${esc(a.c.name)}</b></td><td>${esc(a.cl.name)} <span class="st-meta">${esc(a.cl.startTime)}</span></td><td>${fmtDateBR(a.date)}</td>

      : `<tr><td colspan="4"><div class="empty">Nenhuma falta sem justificativa.</div></td></tr>`}</tbody></table></div>

  <h3 class="dash-section">Liberações emitidas</h3>
  <div class="table-wrap"><table>
    <thead><tr><th>Código</th><th>Aluno</th><th>Falta</th><th>Validade</th><th>Status</th><th></th></tr></thead>
    <tbody>${issued.length ? issued.map(m=>{ const st = makeupStatus(m); const cl = clOf(m.classId); const use = m.use ? clOf(m.use.classId) : null; return `<tr>
      <td><span class="abs-code-pill">${esc(m.code||'—')}</span></td>
      <td><b>${esc(contactName(m.contactId))}</b><div class="st-meta">${m.grantedBy?'por '+esc(m.grantedBy):''}${m.grantNote?' · '+esc(m.grantNote):''}</div></td>
      <td>${esc(cl?cl.name:'—')}<div class="st-meta">${fmtDateBR(m.date)}</div></td>
      <td>${m.expiresAt?fmtDateBR(m.expiresAt):'—'}</td>
      <td><span class="pill ${st==='Liberada'?'req-Aprovada':st==='Recusada'||st==='Expirada'?'req-Recusada':'st-Ativo'}">${esc(st)}</span>${use?`<div class="st-meta">→ ${fmtDateBR(m.use.date)} ${esc(use.startTime)} ${esc(use.name)}</div>`:''}${st==='Recusada'&&m.decisionReason?`<div class="st-meta">${esc(m.decisionReason)}</div>`:''}</td>
      <td>${st==='Liberada' ? `<div class="req-actions"><button class="btn btn-ghost btn-sm" data-act="mk-copy" data-id="${m.id}">Copiar mensagem</button>${canGrant?`<button class="btn btn-ghost btn-sm" data-act="mk-revoke" data-id="${m.id}">Cancelar</button>`:''}</div>` : ''}</td></tr>`; }).join('')

  <p class="st-hint" style="margin-top:10px;">A liberação vale uma remarcação, na mesma unidade e modalidade, dentro da validade. O aluno usa pelo app (“Remarcar aula”) ou digitando o código. Tudo fica na auditoria.</p>`;
}

function renderStudentBooking(c){
  const cls = state.classes.filter(cl=> cl.unitId===c.unitId && cl.modality===c.modality && !(cl.studentIds||[]).includes(c.id));
  const credits = availableCredits(c.id);
  const sessions = upcomingSessions(cls, 7).filter(s=> !s.exc && checkinWindow(s.cl, s.date).canCheckin && clCfg(s.cl).allowMakeup).slice(0, 10);
  const myWaits = [];
  state.classes.forEach(cl=>{ (cl.waitlist||[]).forEach((w,i)=>{ if(w.contactId===c.id) myWaits.push({cl, pos:i+1}); }); });
  return `
  <div class="panel st-panel">
    <div class="st-panel-head"><h3>Remarcar aula (reposição)</h3><span class="pill ${credits.length?'req-Aprovada':'req-Recusada'}">${credits.length} liberação(ões)</span></div>
    <p class="st-hint">${credits.length ? `Use sua liberação ${esc(credits[0].code)} (válida até ${fmtDateBR(credits[0].expiresAt)}) para entrar em outro horário. Se estiver lotada, você entra na fila.` : 'Para remarcar você precisa de uma liberação de reposição, gerada pela gestão depois que sua falta é justificada.'}</p>
    ${sessions.length ? sessions.map(s=>{
      const r = sessionRoster(s.cl, s.date); const booked = r.accIds.includes(c.id); const pos = r.waitlist.findIndex(w=> w.contactId===c.id);
      const full = r.occ >= r.cap;
      return `<div class="st-session">
        <div class="st-date"><div class="st-day">${esc(dayLabel(s.date))}</div><div class="st-time">${esc(s.cl.startTime)}–${esc(s.cl.endTime||'')}</div></div>
        <div class="st-info"><div class="st-cname">${esc(s.cl.name)}</div><div class="st-meta">Prof. ${esc(instructorsOf(s.cl).join(', ')||'—')} · ${r.occ}/${r.cap} vagas${r.waitlist.length?` · fila ${r.waitlist.length}`:''}</div></div>
        <div class="st-actions">${booked ? `<span class="pill req-Aprovada">Reservado</span><button class="st-btn" data-act="st-leave" data-class="${s.cl.id}" data-date="${s.date}">Cancelar</button>`
          : pos>=0 ? `<span class="pill req-Pendente">Fila: ${pos+1}º</span><button class="st-btn" data-act="st-leave" data-class="${s.cl.id}" data-date="${s.date}">Sair</button>`
          : credits.length ? `<button class="st-btn ${full?'':'on'}" data-act="st-book" data-class="${s.cl.id}" data-date="${s.date}">${full?'Entrar na fila':'Remarcar aqui'}</button>` : `<span class="st-closed">precisa de liberação</span>`}</div>
      </div>`; }).join('') : `<div class="empty" style="padding:16px;">Nenhum outro horário disponível nos próximos dias.</div>`}
    ${myWaits.length ? `<div class="ss-sec">Você está na fila para vaga fixa</div>${myWaits.map(x=>`<div class="st-req"><div><div class="st-cname">${esc(classLabel(x.cl))}</div></div><span class="pill req-Pendente">${x.pos}º da fila</span></div>`).join('')}` : ''}
  </div>`;
}

Object.assign(DEMO_ACTIONS, {
  'sched-view': el=>{ state.schedView = el.dataset.v; render(); },
  'week-nav': el=>{ const dd = Number(el.dataset.d); state.schedWeek = dd===0 ? weekStart(todayISO()) : addDaysISO(state.schedWeek || weekStart(todayISO()), dd); render(); },
  'new-type': ()=>{ state.typeCfgDraft = null; state.editingTypeId = null; state.typeDraft = null; state.typeDraftFields = null; state.showTypeModal = true; render(); },
  'edit-type': el=>{ state.typeCfgDraft = null; state.editingTypeId = el.dataset.id; state.typeDraft = null; state.typeDraftFields = null; state.showTypeModal = true; render(); },
  'close-type': ()=>{ state.typeCfgDraft = null; state.showTypeModal = false; state.editingTypeId = null; state.typeDraft = null; state.typeDraftFields = null; render(); },
  'type-color': el=>{ keepTypeFields(); state.typeDraft.color = el.dataset.c; render(); },
  'type-icon': el=>{ keepTypeFields(); state.typeDraft.icon = el.dataset.i; render(); },
  'save-type': async ()=>{
    const g = id=> document.getElementById(id);
    const name = g('ty_name').value.trim(), cap = Number(g('ty_cap').value), dur = Number(g('ty_dur').value);
    const err = m=>{ g('ty_error').textContent = m; };
    if(!name) return err('Informe o nome da turma.');
    if(!(cap>0)) return err('Quantidade de vagas precisa ser maior que zero.');
    if(!(dur>=15)) return err('Tempo de aula precisa ter pelo menos 15 minutos.');
    if(state.classTypes.some(t=> t.name.toLowerCase()===name.toLowerCase() && t.id!==state.editingTypeId)) return err('Já existe uma turma com esse nome.');
    const cfg = {}; document.querySelectorAll('[id^="tc_"]').forEach(el=>{ const k = el.id.slice(3); cfg[k] = el.type==='checkbox' ? el.checked : Number(el.value)||0; });
    const v = {name, capacity:cap, durationMin:dur, note:g('ty_note').value.trim(), color:state.typeDraft.color, icon:state.typeDraft.icon, modality:g('ty_mod').value, level:g('ty_level').value, cfg};
    if(state.editingTypeId){
      const t = state.classTypes.find(x=>x.id===state.editingTypeId); Object.assign(t, v);
      state.classes.filter(c=> c.typeId===t.id).forEach(c=>{ c.name = t.name; c.modality = t.modality; c.level = t.level; c.endTime = minToTime(timeToMin(c.startTime)+t.durationMin); });
      await saveClasses(); audit('Alterou turma', name);
    } else {
      state.classTypes.push({id:'ty_'+uid(), ...v}); audit('Criou turma', `${name} · ${cap} vagas · ${dur} min`);
    }
    await saveClassTypes();
    state.typeCfgDraft = null; state.showTypeModal = false; state.editingTypeId = null; state.typeDraft = null; state.typeDraftFields = null; state.schedView = state.schedView==='week' ? 'types' : state.schedView; render();
    showToast('Turma salva. Agora crie as aulas dela em “Criar aula”.');
  },
  'del-type': async el=>{
    if(state.classes.some(c=> c.typeId===el.dataset.id)){ showToast('Exclua ou mova as aulas desta turma antes'); return; }
    const t = state.classTypes.find(x=>x.id===el.dataset.id);
    state.classTypes = state.classTypes.filter(x=> x.id!==el.dataset.id); audit('Excluiu turma (soft delete)', t?t.name:'');
    await saveClassTypes(); render();
  },
  'new-series': ()=> openAulaModal(null),
  'new-aula-for': el=> openAulaModal(null, el.dataset.id),
  'edit-series': el=> openAulaModal(el.dataset.id),
  'close-series': ()=>{ state.showSeriesModal = false; state.editingSeriesId = null; state.aulaDraft = null; render(); },
  'aula-add-time': ()=>{ readAulaDraft(); state.aulaDraft.times.push(''); render(); },
  'aula-del-time': el=>{ readAulaDraft(); state.aulaDraft.times.splice(Number(el.dataset.i),1); render(); },
  'aula-add-prof': ()=>{ readAulaDraft(); const v = document.getElementById('au_prof_pick').value; if(!v){ showToast('Escolha um professor'); return; } state.aulaDraft.instructors.push(v); render(); },
  'aula-del-prof': el=>{ readAulaDraft(); state.aulaDraft.instructors.splice(Number(el.dataset.i),1); render(); },
  'save-series': async ()=>{
    readAulaDraft();
    const d = state.aulaDraft; const err = m=>{ const e = document.getElementById('au_error'); if(e) e.textContent = m; };
    const type = state.classTypes.find(t=> t.id===d.typeId);
    if(!type) return err('Escolha a turma.');
    if(!(d.capacity>0)) return err('Informe as vagas.');
    if(!d.validFrom) return err(d.kind==='Única' ? 'Informe a data da aula.' : 'Informe a data de início.');
    const days = d.kind==='Única' ? [weekdayName(d.validFrom)] : d.days;
    if(!days.length) return err('Escolha pelo menos um dia da semana.');
    const times = [...new Set(d.times.filter(Boolean))];
    if(!times.length) return err('Informe pelo menos um horário de início.');
    if(!d.instructors.length) return err('Adicione pelo menos um professor.');
    if(!d.unitId) return err('Escolha a unidade.');
    const editingId = state.editingSeriesId;
    // conflito de professor
    for(const t of times){
      const s = timeToMin(t), e = s + type.durationMin;
      const clash = state.classes.find(c=> c.active!==false && (!editingId || c.seriesId!==editingId) && days.includes(c.day)
        && instructorsOf(c).some(n=> d.instructors.includes(n)) && timeToMin(c.startTime) < e && s < timeToMin(c.endTime)
        && (c.kind!=='Única' || d.kind!=='Única' || c.date===d.validFrom));
      if(clash) return err(`Conflito: ${instructorsOf(clash).filter(n=> d.instructors.includes(n)).join(', ')} já tem "${clash.name}" na ${clash.day} das ${clash.startTime} às ${clash.endTime}.`);
    }
    const base = t=> ({typeId:type.id, name:type.name, modality:type.modality, level:type.level, unitId:d.unitId, startTime:t, endTime:minToTime(timeToMin(t)+type.durationMin),
      capacity:d.capacity, minStudents: Math.min(4, d.capacity), instructors:[...d.instructors], instructor:d.instructors[0], kind:d.kind, date: d.kind==='Única' ? d.validFrom : null,
      validFrom:d.validFrom, considerHolidays:d.considerHolidays, notes:d.notes, active:true, personalized: d.capacity<=2});
    let created = 0;
    if(editingId){
      const current = state.classes.filter(c=> c.seriesId===editingId);
      const removed = current.filter(c=> !days.includes(c.day));
      const withStudents = removed.filter(c=> (c.studentIds||[]).length);
      if(withStudents.length) return err(`Não dá para tirar ${withStudents.map(c=>c.day).join(', ')}: há alunos matriculados. Mova os alunos antes.`);
      const oldTime = current[0] && current[0].startTime; const t0 = times[0];
      state.classes = state.classes.filter(c=> !removed.includes(c));
      current.filter(c=> days.includes(c.day)).forEach(c=>{
        const capBefore = c.capacity; Object.assign(c, base(t0));
        if(c.capacity > capBefore) promoteFixed(c);
        if(oldTime!==t0) (c.studentIds||[]).forEach(id=> notifyContact(id, `Sua aula de ${c.day} (${c.name}) mudou de horário: agora ${c.startTime}–${c.endTime}.`));
      });
      days.filter(dd=> !current.some(c=> c.day===dd)).forEach(day=>{ state.classes.push({id:uid(), seriesId:editingId, day, studentIds:[], waitlist:[], ...base(t0)}); created++; });
      times.slice(1).forEach(t=>{ const sid = 's_'+uid(); days.forEach(day=>{ state.classes.push({id:uid(), seriesId:sid, day, studentIds:[], waitlist:[], ...base(t)}); created++; }); });
      audit('Alterou aula', `${type.name} · ${days.map(x=>DAY_SHORT[DAYS.indexOf(x)]).join('/')} ${times.join(', ')} · ${d.instructors.join(', ')}`);
    } else {
      times.forEach(t=>{ const sid = 's_'+uid(); days.forEach(day=>{ state.classes.push({id:uid(), seriesId:sid, day, studentIds:[], waitlist:[], ...base(t)}); created++; }); });
      audit('Criou aula', `${type.name} · ${d.kind} · ${days.map(x=>DAY_SHORT[DAYS.indexOf(x)]).join('/')} ${times.join(', ')} · ${d.instructors.join(', ')}`);
    }
    await saveClasses(); await saveContacts();
    state.showSeriesModal = false; state.editingSeriesId = null; state.aulaDraft = null;
    if(d.kind==='Única' || d.validFrom > addDaysISO(weekStart(todayISO()),6)) state.schedWeek = weekStart(d.validFrom);
    render();
    showToast(editingId ? 'Aula atualizada' : `${created} aula(s) criada(s) na agenda`);
  },
  'toggle-series': async el=>{
    const items = state.classes.filter(c=> c.seriesId===el.dataset.id);
    const to = !(items[0].active!==false);
    items.forEach(c=> c.active = to);
    audit(to?'Reativou aula':'Pausou aula', items[0].name);
    await saveClasses(); render(); showToast(to?'Aula reativada':'Aula pausada — some da agenda e da confirmação');
  },
  'del-series': async el=>{
    const items = state.classes.filter(c=> c.seriesId===el.dataset.id);
    const n = items.reduce((s,c)=> s+(c.studentIds||[]).length, 0);
    if(n){ showToast(`Há ${n} matrícula(s) nessa aula. Mova os alunos ou pause a aula.`); return; }
    state.classes = state.classes.filter(c=> c.seriesId!==el.dataset.id);
    audit('Excluiu aula (soft delete)', items[0].name);
    await saveClasses(); render(); showToast('Aula removida da agenda');
  },
  'add-exception': async ()=>{
    const date = document.getElementById('ex_date').value, unit = document.getElementById('ex_unit').value;
    const reason = document.getElementById('ex_reason').value.trim();
    if(!date || date < todayISO()){ showToast('Escolha uma data a partir de hoje'); return; }
    if(!reason){ showToast('Informe o motivo'); return; }
    const allowed = allowedUnitIds();
    const targets = state.classes.filter(c=> occursOn(c, date) && (unit==='all' || c.unitId===unit) && (!allowed || allowed.has(c.unitId)));
    if(!targets.length){ showToast(`Nenhuma aula em ${fmtDateBR(date)} com esse filtro`); return; }
    let notified = 0;
    targets.forEach(c=>{ state.sessionExceptions[excKey(c.id, date)] = {status:'Cancelada', reason, by:currentUser().name, at:nowISO()};
      [...(c.studentIds||[]), ...peekBooking(c,date).extra].forEach(id=>{ notifyContact(id, `Aula cancelada em ${fmtDateBR(date)} (${c.startTime} · ${c.name}): ${reason}.`); notified++; }); });
    audit('Cancelou aulas', `${fmtDateBR(date)} · ${targets.length} aula(s) · ${reason}`);
    await saveSessionExceptions(); render(); showToast(`${targets.length} aula(s) cancelada(s) · ${notified} aviso(s)`);
  },
  'undo-exception': async el=>{
    el.dataset.keys.split(',').forEach(k=> delete state.sessionExceptions[k]);
    audit('Desfez cancelamento', `${el.dataset.keys.split(',').length} aula(s)`);
    await saveSessionExceptions(); render(); showToast('Cancelamento desfeito');
  },
  // sessão (modal da aula do dia)
  'open-session': el=>{ state.sessionModal = `${el.dataset.id}|${el.dataset.date}`; render(); },
  'close-session': ()=>{ state.sessionModal = null; render(); },
  'ss-add': async ()=>{
    const [cid, date] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid);
    const contactId = document.getElementById('ss_contact').value, mode = document.getElementById('ss_mode').value;
    if(!contactId){ showToast('Escolha o aluno'); return; }
    const free = document.getElementById('ss_free') && document.getElementById('ss_free').checked;
    const c = state.contacts.find(x=>x.id===contactId);
    let credit = null;
    if(mode==='Reposição'){ credit = availableCredits(contactId)[0]; if(!credit && !free){ showToast('Este aluno não tem liberação de reposição (use Check-in livre para passar por cima)'); return; } }
    if(mode!=='fixed' && !free){
      const v = validateCheckin(c, cl, date, mode);
      if(!v.ok){ showToast('Bloqueado: ' + v.errors.join(' · ')); return; }
    }
    if(free) audit('Check-in livre (sem validações)', `${c?c.name:''} · ${classLabel(cl)} ${fmtDateBR(date)} · ${mode}`);
    const res = mode==='fixed' ? enrollFixed(cl, contactId) : acceptSession(cl, date, contactId, mode);
    if(res==='full'){ showToast('Aula lotada e esta turma está sem fila de espera'); return; }
    if(credit && res!=='already'){ credit.status = 'Agendada'; credit.use = {classId:cl.id, date}; await saveMakeups(); }
    if(res!=='waitlist' && res!=='already') audit(mode==='fixed'?'Matriculou na aula':'Incluiu na aula do dia', `${contactName(contactId)} · ${classLabel(cl)}${mode==='fixed'?'':' '+fmtDateBR(date)}`);
    savePlatform(); await saveClasses(); await saveContacts(); await saveSessionBookings(); render();
    showToast(res==='waitlist' ? 'Aula lotada — aluno entrou no fim da fila' : res==='already' ? 'Aluno já está nesta aula' : 'Aluno incluído');
  },
  'ss-accept': async el=>{
    const [cid, date] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid);
    const res = acceptSession(cl, date, el.dataset.c);
    audit('Confirmou presença pelo aluno', `${contactName(el.dataset.c)} · ${classLabel(cl)} ${fmtDateBR(date)} · ${res}`);
    savePlatform(); await saveSessionBookings(); render(); showToast(res==='waitlist' ? 'Aula lotada — aluno foi para a fila' : 'Presença confirmada');
  },
  'ss-remove': async el=>{
    const [cid, date] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid);
    const promoted = declineSession(cl, date, el.dataset.c, currentUser().name);
    audit('Removeu aluno da aula', `${contactName(el.dataset.c)} · ${classLabel(cl)} ${fmtDateBR(date)}${promoted.length?' · entrou '+promoted.join(', '):''}`);
    savePlatform(); await saveSessionBookings(); render();
    showToast(promoted.length ? `Removido — ${promoted.join(', ')} saiu da fila e entrou na vaga` : 'Aluno removido da aula');
  },
  'ss-unenroll': async el=>{
    const [cid] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid);
    const before = (cl.waitlist||[]).map(w=>w.contactId);
    unenrollFixed(cl, el.dataset.c, 'desistência');
    const entered = before.filter(id=> (cl.studentIds||[]).includes(id)).map(contactName);
    notifyContact(el.dataset.c, `Sua matrícula em ${classLabel(cl)} foi encerrada.`);
    await saveClasses(); await saveContacts(); render();
    showToast(entered.length ? `Vaga liberada — ${entered.join(', ')} saiu da fila e foi matriculado` : 'Aluno saiu da turma');
  },
  'ss-leave': async el=>{
    const [cid, date] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid);
    declineSession(cl, date, el.dataset.c, currentUser().name);
    audit('Tirou da fila da aula', `${contactName(el.dataset.c)} · ${classLabel(cl)} ${fmtDateBR(date)}`);
    savePlatform(); await saveSessionBookings(); render(); showToast('Removido da fila');
  },
  'ss-leave-fixed': async el=>{
    const [cid] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid);
    leaveFixedWaitlist(cl, el.dataset.c); audit('Saiu da fila da turma', `${contactName(el.dataset.c)} · ${classLabel(cl)}`);
    await saveClasses(); render();
  },
  'ss-cancel': async ()=>{
    const [cid, date] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid);
    const reason = (document.getElementById('ss_reason').value||'').trim();
    if(!reason){ showToast('Informe o motivo do cancelamento'); return; }
    state.sessionExceptions[excKey(cid, date)] = {status:'Cancelada', reason, by:currentUser().name, at:nowISO()};
    [...(cl.studentIds||[]), ...peekBooking(cl,date).extra].forEach(id=> notifyContact(id, `Aula cancelada em ${fmtDateBR(date)} (${cl.startTime} · ${cl.name}): ${reason}.`));
    audit('Cancelou aula', `${classLabel(cl)} ${fmtDateBR(date)} · ${reason}`);
    await saveSessionExceptions(); render(); showToast('Aula cancelada e alunos avisados');
  },
  'ss-uncancel': async ()=>{
    const [cid, date] = state.sessionModal.split('|');
    delete state.sessionExceptions[excKey(cid, date)]; audit('Reativou aula', `${fmtDateBR(date)}`);
    await saveSessionExceptions(); render();
  },
  'ss-msg': ()=>{
    const [cid, date] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid); const t = typeOf(cl);
    const txt = `Olá, turma ${cl.name}! Lembrete da aula de ${dayLabel(date)} (${fmtDateBR(date)}) às ${cl.startTime} em ${unitName(cl.unitId)}.${t&&t.note?' '+t.note:''} Confirme ou cancele pelo app até ${fmtMin(clCfg(cl).cancelMin)} antes.`;
    try{ navigator.clipboard && navigator.clipboard.writeText(txt); }catch(e){}
    audit('Mensagem para a turma', `${classLabel(cl)} ${fmtDateBR(date)}`);
    showToast('Mensagem copiada — cole no WhatsApp da turma');
  },
  'ss-edit': ()=>{ const [cid] = state.sessionModal.split('|'); const cl = state.classes.find(c=>c.id===cid); state.sessionModal = null; openAulaModal(cl.seriesId); },
  'ss-attendance': ()=>{ state.attendanceClassId = state.sessionModal; state.sessionModal = null; state.showAttendanceModal = true; render(); },
  // aluno
  'st-book': async el=>{
    const c = myContact(); const cl = state.classes.find(x=>x.id===el.dataset.class);
    const credit = availableCredits(c.id)[0];
    if(!credit){ showToast('Você precisa de uma liberação de reposição para remarcar'); return; }
    const v = validateCheckin(c, cl, el.dataset.date, 'Reposição');
    if(!v.ok){ showToast('Não foi possível remarcar: ' + v.errors[0]); return; }
    const res = acceptSession(cl, el.dataset.date, c.id, 'Reposição');
    if(res==='full'){ showToast('Aula lotada e sem fila de espera'); return; }
    credit.status = 'Agendada'; credit.use = {classId:cl.id, date:el.dataset.date, waitlist: res==='waitlist'};
    await saveMakeups();
    audit('Reservou aula extra', `${c.name} · ${classLabel(cl)} ${fmtDateBR(el.dataset.date)} · ${res==='waitlist'?'fila':'confirmado'}`);
    savePlatform(); await saveSessionBookings(); render();
    showToast(res==='waitlist' ? `Aula lotada — você é o ${sessionRoster(cl, el.dataset.date).waitIds.indexOf(c.id)+1}º da fila` : 'Aula reservada');
  },
  'st-leave': async el=>{
    const c = myContact(); const cl = state.classes.find(x=>x.id===el.dataset.class);
    const promoted = declineSession(cl, el.dataset.date, c.id);
    const credit = (state.makeups||[]).find(m=> m.contactId===c.id && m.status==='Agendada' && m.use && m.use.classId===cl.id && m.use.date===el.dataset.date);
    if(credit){ credit.status = 'Liberada'; delete credit.use; await saveMakeups(); }
    audit('Cancelou reserva', `${c.name} · ${classLabel(cl)} ${fmtDateBR(el.dataset.date)}${promoted.length?' · vaga passou para '+promoted.join(', '):''}`);
    savePlatform(); await saveSessionBookings(); render(); showToast('Reserva cancelada');
  },
});
function keepTypeFields(){
  // preserva o que já foi digitado no modal de turma antes de re-renderizar
  const g = id=> document.getElementById(id);
  if(!g('ty_name')) return;
  const cfg = {}; document.querySelectorAll('[id^="tc_"]').forEach(el=>{ cfg[el.id.slice(3)] = el.type==='checkbox' ? el.checked : Number(el.value)||0; });
  state.typeCfgDraft = cfg;
  state.typeDraftFields = {name:g('ty_name').value, cap:g('ty_cap').value, dur:g('ty_dur').value, note:g('ty_note').value, mod:g('ty_mod').value, level:g('ty_level').value};
}
Object.assign(DEMO_CHANGES, {
  'sched-unit': el=>{ state.schedUnit = el.value; render(); },
  'sched-instr': el=>{ state.schedInstr = el.value; render(); },
  'aula-type': el=>{ readAulaDraft(); const t = state.classTypes.find(x=>x.id===el.value); if(t) state.aulaDraft.capacity = t.capacity; render(); },
  'aula-kind': el=>{ readAulaDraft(); render(); },
});


bootDemo().catch(err=>{
  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading">Não foi possível carregar o CRM. Tente recarregar a página.</div>`;
  console.error(err);
});
</script>
